<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D55C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tessera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tessera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 600px column. Home = review card first (what's due), then units as plain lesson lists. Lesson = progress bar, exercise, fixed check bar. No game layer. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunk:#E6EAF0; --ink:#18202F; --muted:#5B677C; --line:#D5DBE4;
  --accent:#2D55C8; --accent-d:#1E3C99; --accent-t:#E3E9FA;
  --ok:#1F8A65; --ok-d:#166B4E; --ok-t:#DDF1E8;
  --bad:#BC3C35; --bad-d:#8E2A25; --bad-t:#FAE4E2;
  --on:#FFFFFF;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151E; --surface:#19202E; --sunk:#141A25; --ink:#E6EBF3; --muted:#97A3B7; --line:#2A3345;
  --accent:#6A8DF2; --accent-d:#3E5FC2; --accent-t:#1D2A4B;
  --ok:#3CBE8C; --ok-d:#258560; --ok-t:#13302A;
  --bad:#EC6B62; --bad-d:#A9443D; --bad-t:#3A1E1D;
  --on:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151E; --surface:#19202E; --sunk:#141A25; --ink:#E6EBF3; --muted:#97A3B7; --line:#2A3345;
  --accent:#6A8DF2; --accent-d:#3E5FC2; --accent-t:#1D2A4B;
  --ok:#3CBE8C; --ok-d:#258560; --ok-t:#13302A;
  --bad:#EC6B62; --bad-d:#A9443D; --bad-t:#3A1E1D;
  --on:#FFFFFF; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--on);box-shadow:0 2px 0 var(--accent-d);font-weight:600;font-size:16px}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:none}
.btn[disabled]{background:var(--sunk);box-shadow:none;color:var(--muted);cursor:default}
.btn.wide{flex:1 1 auto}
.btn-ok{background:var(--ok);box-shadow:0 2px 0 var(--ok-d)}
.btn-bad{background:var(--bad);box-shadow:0 2px 0 var(--bad-d)}
.btn-line{background:var(--surface);color:var(--accent);box-shadow:none;border:2px solid var(--line)}
.btn-line[disabled]{background:var(--surface);color:var(--muted)}
.btn-text{background:none;box-shadow:none;color:var(--muted);padding:0 8px;min-height:44px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk)}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:12px;font-weight:600;min-width:0}
.chip:hover{background:var(--sunk)}
.code{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--on);font-weight:700;font-size:13px;letter-spacing:.04em;flex:none}

.home{padding-block:20px 80px;display:flex;flex-direction:column;gap:28px}
.hero h1{font-size:clamp(26px,6vw,32px);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.fig{background:var(--surface);padding:10px 12px}
.fig b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.fig span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.card .row .btn{flex:1 1 180px}

.unit{display:flex;flex-direction:column;gap:10px}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.uhead>div{min-width:0}
.ulabel{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.uhead h2{margin:2px 0 0;font-size:20px;line-height:1.2}
.uhead h2 small{font-weight:400;color:var(--muted);font-size:15px}
.lessons{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.lrow:hover{border-color:var(--muted)}
.lrow .st{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:var(--on)}
.lrow.done .st{background:var(--ok);border-color:var(--ok)}
.lrow.next{border:2px solid var(--accent);padding:11px 13px}
.lrow .lname{font-weight:600}
.lrow .lsub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-t);padding:3px 8px;border-radius:6px}
.endlevel{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px;margin:0}

.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:20}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);max-height:86vh;overflow:auto;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sheet h3{margin:0;font-size:20px}
.sheet h4{margin:20px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p{color:var(--muted);margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.courses{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px}
.crow.on{border:2px solid var(--accent);padding:11px}
.crow b{display:block}
.crow small{color:var(--muted);font-size:13px}
.pct{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.wlist,.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wlist li{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.slist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.wt{font-weight:600}
.we,.se{color:var(--muted);font-size:14px}
.due{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.switch{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;padding:4px 0}
.switch .knob{width:50px;height:30px;border-radius:30px;background:var(--sunk);border:1px solid var(--line);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted)}
.switch[aria-checked="true"] .knob{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"] .knob::after{transform:translateX(20px);background:var(--on)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.savebadge{display:inline-flex;align-items:center;gap:8px;font-size:14px;background:var(--sunk);padding:8px 12px;border-radius:10px}
.savebadge i{width:8px;height:8px;border-radius:2px;background:var(--muted)}
.savebadge.acct i{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center}

.lesson{display:flex;flex-direction:column;min-height:100%}
.ltop{display:flex;align-items:center;gap:12px;padding-block:12px}
.track{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fillbar{height:100%;width:0;border-radius:99px;background:var(--ok);transition:width .3s ease}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
#ex{padding-block:10px 190px;display:flex;flex-direction:column;gap:20px}
#ex.locked .opt,#ex.locked .tile,#ex.locked .input,#ex.locked .acc{pointer-events:none}
.qhead{display:flex;flex-direction:column;gap:4px}
.newtag{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.qt{margin:0;font-size:20px;font-weight:600;line-height:1.25;text-wrap:balance}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-size:28px;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.sent{font-size:21px;font-weight:500;line-height:1.5;min-width:0}
.spk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-t);color:var(--accent);flex:none}
.spk.sm{width:34px;height:34px;border-radius:9px}
.spk.huge{width:88px;height:88px;border-radius:20px}
.spk.slow{width:60px;height:60px;border-radius:16px;font-size:13px;font-weight:600}
.listenrow{display:flex;align-items:flex-end;gap:16px;justify-content:center;padding-block:8px}
.gl{border-bottom:2px dotted var(--muted);cursor:pointer;padding-bottom:1px}
.gl:hover{border-bottom-color:var(--accent);color:var(--accent)}
.hint{min-height:22px;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);text-align:center}
.sub-en{color:var(--muted);font-size:15px;margin:0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;text-align:left}
.opt:hover{background:var(--sunk)}
.opt .k{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;font-size:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-t)}
.opt.right{border-color:var(--ok);background:var(--ok-t)}
.opt.wrong{border-color:var(--bad);background:var(--bad-t)}
.lines{min-height:112px;padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 55px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:9px 14px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px}
.tile.used{background:var(--sunk);border-color:var(--sunk);color:transparent;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{min-height:54px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:var(--accent-t)}
.mt.done{opacity:.35;pointer-events:none}
.mt.miss{border-color:var(--bad);background:var(--bad-t)}
.input{width:100%;font:inherit;font-size:20px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.acc{min-width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot.ok{background:var(--ok-t);border-top-color:var(--ok-t)}
.foot.bad{background:var(--bad-t);border-top-color:var(--bad-t)}
.footin{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:14px}
.footin .btn.wide{min-width:min(100%,200px)}
.foot-note{color:var(--muted);font-size:14px;flex:1;text-align:center}
.fbmsg{flex:1 1 260px;min-width:0}
.fbmsg strong{display:block;font-size:18px}
.foot.ok .fbmsg strong{color:var(--ok)}
.foot.bad .fbmsg strong{color:var(--bad)}
.fbans{font-size:17px;margin-top:2px;overflow-wrap:anywhere;font-weight:500}
.fbnote{font-size:14px;margin-top:4px;color:var(--muted)}

.endscr{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.endscr h1{margin:0;font-size:26px;line-height:1.2}
.endscr .lead{margin:0;color:var(--muted)}
.misses{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.misses li{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.misses li:last-child{border-bottom:0}
.misses .q{color:var(--muted)}
.misses .a{font-weight:600}
.endscr .row .btn{flex:1 1 180px}

.pat{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.pat .ptitle{margin:0;font-size:18px}
.pat ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.pat li{line-height:1.5}
.pat .cf{margin:0;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pat .ex{font-weight:600}
.passage{font-size:19px;line-height:1.65;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.reveal{font-size:24px;font-weight:600;min-height:40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.self{display:flex;gap:10px;flex:1 1 260px}
.self .btn{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-t)}
.est{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.checking{color:var(--muted);font-size:15px}

.passage{white-space:pre-line}
.msgs{display:flex;flex-direction:column;gap:10px;padding-block:10px 230px;min-height:40vh}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--accent-t);border-bottom-right-radius:6px}
.bub.typing{color:var(--muted);letter-spacing:.2em}
.fix{align-self:flex-end;max-width:88%;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:-4px}
.fix b{color:var(--bad);font-weight:600}
.fix.good{color:var(--ok)}
</style>

</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';

/* Course content. Unit: p = pattern note {h, l[], cf}; w = words [target, english, [accepted]]; s = sentences [target, english]; f = fills [sentence with ___, answer, [distractors], english]; r = passage {t, q:[[question, answer, [distractors]]]} */
const COURSES = {
la: { name:'Latin', native:'Lingua Latīna', note:'Classical, with macrons · follows Wheelock', lang:'la', levels:[{units:[
  {t:'Sum', en:'To be, and no articles',
   p:{h:'Latin has no “a” or “the”, and drops pronouns', l:[
     '<span class="ex">puella</span> means girl, a girl, or the girl. Context decides.',
     'The verb ending tells you who: <span class="ex">sum</span> I am · <span class="ex">es</span> you are · <span class="ex">est</span> he/she/it is · <span class="ex">sumus</span> we are · <span class="ex">estis</span> you all are · <span class="ex">sunt</span> they are.',
     'Word order is free; the verb usually comes last. <span class="ex">Nauta sum</span> = I am a sailor.',
     'Macrons (ā ē ī ō ū) mark long vowels. Type without them and you are still marked right.'],
     cf:'Spanish soy / es / son, Italian sono / è / sono and Portuguese sou / é / são all descend from these forms.'},
   w:[['puella','girl'],['nauta','sailor'],['poēta','poet'],['vīta','life'],['patria','fatherland'],['fortūna','fortune, luck'],['pecūnia','money'],['fāma','fame, rumor'],['et','and'],['nōn','not']],
   s:[['Nauta sum.','I am a sailor.'],['Poēta nōn es.','You are not a poet.'],['Puella est.','She is a girl.'],['Pecūnia nōn est vīta.','Money is not life.'],['Fāma et fortūna.','Fame and fortune.'],['Poēta et nauta sunt.','They are a poet and a sailor.']],
   f:[['Nauta ___.','sum',['est','es'],'I am a sailor.'],['Pecūnia ___ est vīta.','nōn',['et','sum'],'Money is not life.'],['Poēta et nauta ___.','sunt',['est','sumus'],'They are a poet and a sailor.']],
   r:{t:'Poēta sum. Patria mea Rōma est. Nauta nōn sum; pecūnia nōn est vīta.', q:[['What is the speaker?','A poet',['A sailor','A girl']],['What does the speaker say about money?','It is not life',['It is fortune','It is fame']]]}},
  {t:'Prīma dēclīnātiō', en:'First declension and -ō verbs',
   p:{h:'The ending shows the job a noun does', l:[
     'Subject (nominative): <span class="ex">puell<b>a</b></span>. Direct object (accusative): <span class="ex">puell<b>am</b></span>. <span class="ex">Puella rosam amat</span> = the girl loves the rose; <span class="ex">Rosam puella amat</span> means the same.',
     'Verbs: <span class="ex">amō</span> I love · <span class="ex">amās</span> you love · <span class="ex">amat</span> he/she loves · <span class="ex">amāmus</span> we love · <span class="ex">amātis</span> you all love · <span class="ex">amant</span> they love.',
     '<span class="ex">videō, vidēs, videt</span> (see) and <span class="ex">habeō, habēs, habet</span> (have) use the same endings on a different stem.'],
     cf:'The Spanish, Italian and Portuguese -o / -as / -a endings (hablo, hablas, habla) are these Latin endings worn down.'},

  {t:'Gustar', en:'Likes and preferences',
   p:{h:'Gustar works backwards: the thing liked is the subject', l:[
     '<span class="ex">Me gusta el café</span> = coffee pleases me. <span class="ex">Me gustan los libros</span> = books please me. Singular thing → <span class="ex">gusta</span>; plural → <span class="ex">gustan</span>.',
     'Who likes it is a pronoun: <span class="ex">me</span> · <span class="ex">te</span> · <span class="ex">le</span> (he/she/you formal) · <span class="ex">nos</span> · <span class="ex">les</span>.',
     'To name the person, add <span class="ex">a</span>: <span class="ex">A Ana le gusta bailar</span>. Doing something: <span class="ex">me gusta leer</span> (always singular).',
     '<span class="ex">encantar</span> works the same and means to love (things): <span class="ex">Me encanta la música.</span>'],
     cf:'Italian mi piace / mi piacciono and Portuguese eu gosto de work differently: Portuguese uses a normal verb with “de”. Italian matches Spanish.'},
   w:[['gustar','to be pleasing (to like)'],['encantar','to love (a thing)'],['la música','the music'],['el deporte','the sport'],['la película','the film'],['cantar','to sing'],['bailar','to dance'],['viajar','to travel'],['cocinar','to cook'],['preferir','to prefer']],
   s:[['Me gusta la música.','I like music.'],['Me gustan los deportes.','I like sports.'],['A mi hermana le encanta bailar.','My sister loves dancing.'],['¿Te gusta cocinar?','Do you like cooking?'],['Nos gusta viajar.','We like traveling.'],['Prefiero las películas a los libros.','I prefer films to books.']],
   f:[['Me ___ la música.','gusta',['gustan','gusto'],'I like music.'],['Me ___ los deportes.','gustan',['gusta','gustamos'],'I like sports.'],['A mi hermana ___ encanta bailar.','le',['la','se'],'My sister loves dancing.']],

  {t:'Estar + gerundio', en:'What is happening now, and the weather',

     'Spanish uses it less than English. <span class="ex">Trabajo en Madrid</span> for a habit; <span class="ex">estoy trabajando</span> only for this very moment.',
     'Weather uses <span class="ex">hacer</span>: <span class="ex">hace calor</span> · <span class="ex">hace frío</span> · <span class="ex">hace sol</span> · <span class="ex">hace buen tiempo</span>. Rain and snow are verbs: <span class="ex">llueve</span>, <span class="ex">nieva</span>.',

   s:[['Estoy comiendo ahora mismo.','I am eating right now.'],['Mi madre está leyendo.','My mother is reading.'],['Hace calor en verano.','It is hot in summer.'],['Hace frío y llueve.','It is cold and raining.'],['¿Qué tiempo hace afuera?','What is the weather like outside?'],['Estamos trabajando mucho esta semana.','We are working a lot this week.']],
   f:[['Estoy ___ ahora mismo.','comiendo',['como','comer'],'I am eating right now.'],['___ calor en verano.','Hace',['Es','Está'],'It is hot in summer.'],['Mi madre está ___.','leyendo',['leiendo','lee'],'My mother is reading.']],
   r:{t:'Hoy hace frío y llueve mucho. No quiero salir. Estoy leyendo en casa y mi hermano está cocinando. En verano hace calor y hace sol; entonces vamos a la playa cada fin de semana. Prefiero el verano.', q:[['What is the brother doing?','Cooking',['Reading','Going out']],['What does the family do in summer?','Goes to the beach every weekend',['Stays home','Works more']]]}},
  {t:'Verbos irregulares', en:'The -go verbs, saber and conocer',
   p:{h:'A handful of verbs change only in the “I” form', l:[
     '<span class="ex">hacer</span> → <span class="ex">hago</span> · <span class="ex">salir</span> → <span class="ex">salgo</span> · <span class="ex">poner</span> → <span class="ex">pongo</span> · <span class="ex">venir</span> → <span class="ex">vengo</span> · <span class="ex">decir</span> → <span class="ex">digo</span> · <span class="ex">ver</span> → <span class="ex">veo</span> · <span class="ex">dar</span> → <span class="ex">doy</span>. The other forms are regular (haces, hace…).',
     '<span class="ex">saber</span> → <span class="ex">sé</span>: to know facts or how to: <span class="ex">Sé nadar</span>, <span class="ex">No sé.</span> <span class="ex">conocer</span> → <span class="ex">conozco</span>: to know people or places: <span class="ex">Conozco Madrid.</span>',
     '<span class="ex">poder</span> → <span class="ex">puedo</span> · <span class="ex">puedes</span> · <span class="ex">puede</span> · <span class="ex">podemos</span> · <span class="ex">pueden</span>; followed by an infinitive: <span class="ex">¿Puedes venir?</span>'],
     cf:'Italian faccio / esco / vengo / dico and Portuguese faço / saio / venho / digo are the same irregulars. Saber / conocer = Italian sapere / conoscere = Portuguese saber / conhecer.'},
   w:[['saber','to know (facts, how to)'],['conocer','to know (people, places)'],['poder','to be able to'],['salir','to go out, to leave'],['poner','to put'],['venir','to come'],['decir','to say'],['ver','to see'],['dar','to give'],['nada','nothing']],
   s:[['No sé.','I don’t know.'],['Conozco a tu hermano.','I know your brother.'],['¿Puedes venir mañana?','Can you come tomorrow?'],['Salgo del trabajo a las seis.','I leave work at six.'],['Pongo el libro en la mesa.','I put the book on the table.'],['No digo nada.','I say nothing.']],
   f:[['No ___ nada.','sé',['conozco','sabo'],'I don’t know anything.'],['___ a tu hermano.','Conozco',['Sé','Conoco'],'I know your brother.'],['___ del trabajo a las seis.','Salgo',['Salo','Sale'],'I leave work at six.']],
   r:{t:'Conozco bien la ciudad, pero no sé dónde está el mercado nuevo. Salgo de casa a las nueve y veo a mi amigo Pablo. Pablo dice que el mercado está cerca de la iglesia. Le doy las gracias y voy.', q:[['What does the speaker not know?','Where the new market is',['Pablo','The city']],['Where is the market, according to Pablo?','Near the church',['Near the house','Far away']]]}},
  {t:'Pronombres de objeto', en:'Him, her, it, them',
   p:{h:'Object pronouns go before the conjugated verb', l:[
     'Direct object (whom / what): <span class="ex">me</span> · <span class="ex">te</span> · <span class="ex">lo</span> / <span class="ex">la</span> (him, her, it) · <span class="ex">nos</span> · <span class="ex">los</span> / <span class="ex">las</span>. <span class="ex">Lo veo</span> = I see him / it. <span class="ex">La llamo</span> = I call her.',
     'Indirect object (to whom): <span class="ex">me</span> · <span class="ex">te</span> · <span class="ex">le</span> · <span class="ex">nos</span> · <span class="ex">les</span>. <span class="ex">Le escribo</span> = I write to him / her.',
     'With an infinitive, attach it: <span class="ex">quiero verlo</span>, <span class="ex">voy a llamarla</span>. Both positions are correct: <span class="ex">lo quiero ver</span>.',
     'People as direct objects take <span class="ex">a</span>: <span class="ex">Busco a mi hermano.</span>'],
     cf:'Italian lo / la / li / le and Portuguese o / a / os / as. Brazilian Portuguese often just repeats the noun or uses ele / ela instead.'},
   w:[['ayudar','to help'],['llamar','to call'],['esperar','to wait, to hope'],['buscar','to look for'],['encontrar','to find'],['entender','to understand'],['el regalo','the gift'],['el mensaje','the message'],['la pregunta','the question'],['la respuesta','the answer']],
   s:[['Lo veo cada día.','I see him every day.'],['¿Me ayudas?','Will you help me?'],['La llamo mañana.','I will call her tomorrow.'],['Le escribo un mensaje.','I write him a message.'],['No entiendo la pregunta.','I don’t understand the question.'],['Busco el regalo y no lo encuentro.','I look for the gift and I don’t find it.']],
   f:[['___ veo cada día.','Lo',['Le','Él'],'I see him every day.'],['___ escribo un mensaje.','Le',['Lo','La'],'I write him a message.'],['Busco el regalo y no ___ encuentro.','lo',['le','la'],'I look for the gift and don’t find it.']],
   r:{t:'Mi amiga Clara me escribe un mensaje: tiene una pregunta sobre el trabajo. No la entiendo bien, así que la llamo. La espero diez minutos y luego ella me llama. Le doy la respuesta y me da las gracias.', q:[['Why does the speaker call Clara?','To understand her question better',['To give her a gift','To look for her']],['What does the speaker give Clara?','The answer',['A message','A gift']]]}},
  {t:'El pretérito', en:'Finished past actions, regular verbs',
   p:{h:'The preterite tells what happened', l:[
     '-ar: <span class="ex">hablé</span> · <span class="ex">hablaste</span> · <span class="ex">habló</span> · <span class="ex">hablamos</span> · <span class="ex">hablaron</span>. The accents on <span class="ex">hablé</span> / <span class="ex">habló</span> change meaning: <span class="ex">hablo</span> = I speak, <span class="ex">habló</span> = he spoke.',
     '-er and -ir share one set: <span class="ex">comí</span> · <span class="ex">comiste</span> · <span class="ex">comió</span> · <span class="ex">comimos</span> · <span class="ex">comieron</span>; <span class="ex">viví</span>, <span class="ex">vivió</span>…',
     'Time words that call for it: <span class="ex">ayer</span>, <span class="ex">anoche</span>, <span class="ex">la semana pasada</span>, <span class="ex">el año pasado</span>.',
     'Spelling guards in the “I” form: <span class="ex">llegar</span> → <span class="ex">llegué</span>, <span class="ex">buscar</span> → <span class="ex">busqué</span>, <span class="ex">empezar</span> → <span class="ex">empecé</span>.'],
     cf:'Portuguese pretérito perfeito (falei, falou, comi) is nearly identical. Italian uses passato prossimo (ho parlato) for the same job.'},

   s:[['Ayer hablé con mi madre.','Yesterday I spoke with my mother.'],['Anoche comimos tarde.','Last night we ate late.'],['Llegué a casa a las diez.','I arrived home at ten.'],['La semana pasada visitamos a mis padres.','Last week we visited my parents.'],['Ya terminé el libro.','I already finished the book.'],['¿Empezaste el trabajo nuevo?','Did you start the new job?']],
   f:[['Ayer ___ con mi madre.','hablé',['hablo','habló'],'Yesterday I spoke with my mother.'],['Anoche ___ tarde.','comimos',['comemos','comieron'],'Last night we ate late.'],['___ a casa a las diez.','Llegué',['Llegé','Llego'],'I arrived home at ten.']],
   r:{t:'El año pasado visité España. Llegué a Madrid el lunes y empecé a hablar español el primer día. Comí mucho, bebí café en la calle y caminé por la ciudad cada noche. Terminé el viaje el viernes; todavía pienso en Madrid.', q:[['When did the speaker arrive in Madrid?','On Monday',['On Friday','Last night']],['What did the speaker do every night?','Walked around the city',['Visited parents','Drank wine']]]}},
  {t:'Pretéritos irregulares', en:'The past tense you hear most',
   p:{h:'Ten irregular preterites cover most conversation', l:[
     '<span class="ex">ser</span> and <span class="ex">ir</span> share one form: <span class="ex">fui</span> · <span class="ex">fuiste</span> · <span class="ex">fue</span> · <span class="ex">fuimos</span> · <span class="ex">fueron</span>. Context tells “I was” from “I went”.',
     'New stems, no accents: <span class="ex">tener</span> → <span class="ex">tuve</span> · <span class="ex">estar</span> → <span class="ex">estuve</span> · <span class="ex">hacer</span> → <span class="ex">hice</span> (<span class="ex">hizo</span>) · <span class="ex">poder</span> → <span class="ex">pude</span> · <span class="ex">poner</span> → <span class="ex">puse</span> · <span class="ex">venir</span> → <span class="ex">vine</span> · <span class="ex">decir</span> → <span class="ex">dije</span>.',
     'The endings on these stems: <span class="ex">-e</span> · <span class="ex">-iste</span> · <span class="ex">-o</span> · <span class="ex">-imos</span> · <span class="ex">-ieron</span> (decir: <span class="ex">dijeron</span>).',
     '<span class="ex">ver</span> → <span class="ex">vi</span>, <span class="ex">vio</span>. <span class="ex">dar</span> → <span class="ex">di</span>, <span class="ex">dio</span>.'],
     cf:'Portuguese fui / tive / fiz / estive / pude / vim / disse line up almost one for one. Italian avoids most of this with ho avuto / ho fatto.'},
   w:[['el viaje','the trip'],['la fiesta','the party'],['el problema','the problem'],['la vez','the time, occasion'],['nunca','never'],['algo','something'],['alguien','someone'],['nadie','nobody'],['la verdad','the truth'],['tarde','late']],
   s:[['Fui al mercado ayer.','I went to the market yesterday.'],['La fiesta fue el viernes.','The party was on Friday.'],['Tuve un problema con el tren.','I had a problem with the train.'],['¿Qué hiciste anoche?','What did you do last night?'],['Vine tarde y no vi a nadie.','I came late and saw no one.'],['Dijo la verdad.','He told the truth.']],
   f:[['___ al mercado ayer.','Fui',['Fue','Iba'],'I went to the market yesterday.'],['¿Qué ___ anoche?','hiciste',['hizo','haciste'],'What did you do last night?'],['___ un problema con el tren.','Tuve',['Tení','Tiene'],'I had a problem with the train.']],
   r:{t:'El viernes fue la fiesta de Clara. Tuve un problema con el trabajo y llegué tarde. No vi a nadie en la puerta, pero alguien dijo mi nombre: fue Pablo. Hicimos una foto, comimos algo y dijimos adiós a las doce. Fue una noche muy buena.', q:[['Why did the speaker arrive late?','A problem at work',['The train','The weather']],['Who said the speaker’s name?','Pablo',['Clara','Nobody']]]}},
  {t:'Comparar y opinar', en:'Comparisons and opinions',

{tip:'Pair this level with real input. Thirty minutes a day of something made for learners pays more than extra drills now: a graded reader (Olly Richards, Short Stories in Spanish for Beginners, then Intermediate), a podcast (Coffee Break Spanish for structure, Hoy Hablamos or Españolistos for natural speech), or a series you know with Spanish audio and Spanish subtitles. Log that time here.', units:[
  {t:'El imperfecto', en:'How things used to be',
   p:{h:'The imperfect describes background, habits and the past as it was', l:[
     '-ar: <span class="ex">hablaba</span> · <span class="ex">hablabas</span> · <span class="ex">hablaba</span> · <span class="ex">hablábamos</span> · <span class="ex">hablaban</span>. -er / -ir: <span class="ex">comía</span> · <span class="ex">comías</span> · <span class="ex">comía</span> · <span class="ex">comíamos</span> · <span class="ex">comían</span>.',
     'Only three irregulars: <span class="ex">ser</span> → era, eras, era, éramos, eran · <span class="ex">ir</span> → iba, ibas, iba, íbamos, iban · <span class="ex">ver</span> → veía.',
     'Use it for habits, descriptions, age, time and weather in the past: <span class="ex">Cuando era niño, vivía en un pueblo. Eran las ocho y hacía frío.</span>',

     cf:'Italian imperfetto (parlavo, ero) and Portuguese imperfeito (falava, era). Latin amābam is the ancestor; the -ba- survives in Spanish -aba and Portuguese -ava.'},
   w:[['de niño','as a child'],['mientras','while'],['el pueblo','the town, the village'],['la escuela','the school'],['jugar','to play'],['el perro','the dog'],['el jardín','the garden'],['los abuelos','the grandparents'],['todos los días','every day'],['pequeño','small']],
   s:[['Cuando era niño, vivía en un pueblo pequeño.','When I was a child, I lived in a small town.'],['Mis abuelos tenían un perro.','My grandparents had a dog.'],['Jugaba en el jardín todos los días.','I played in the garden every day.'],['Íbamos a la escuela a pie.','We went to school on foot.'],['Mientras mi madre cocinaba, yo leía.','While my mother cooked, I read.'],['Eran las ocho y hacía frío.','It was eight o’clock and it was cold.']],
   f:[['Cuando ___ niño, vivía en un pueblo.','era',['fui','soy'],'When I was a child, I lived in a town.'],['Mis abuelos ___ un perro.','tenían',['tuvieron','tienen'],'My grandparents had a dog.'],['___ a la escuela a pie.','Íbamos',['Fuimos','Vamos'],'We went to school on foot.']],
   r:{t:'De niño vivía en un pueblo pequeño. Mis abuelos tenían una casa con un jardín grande y un perro que se llamaba Max. Todos los días, después de la escuela, jugaba en el jardín mientras mi abuela cocinaba. Los domingos íbamos a la iglesia y luego comíamos todos juntos. Era una vida tranquila.', q:[['What was the dog called?','Max',['Pedro','Luis']],['What did the family do on Sundays?','Went to church and ate together',['Played in the garden','Visited the city']]]}},

   f:[['Mientras ___, llegó mi hermano.','cenábamos',['cenamos','cenaremos'],'While we were having dinner, my brother arrived.'],['Llovía cuando ___ de casa.','salí',['salía','salgo'],'It was raining when I left the house.'],['Ayer ___ a tu amiga.','conocí',['conocía','conozco'],'Yesterday I met your friend.']],
   r:{t:'Anoche cenaba con mi familia cuando sonó el teléfono. Era mi amigo Pablo. Me dijo que tenía una noticia importante: por fin encontró trabajo en Madrid. Mientras hablábamos, mi madre preparaba café. Cuando terminé la llamada, todos querían saber qué ocurrió. Fue una buena noche.', q:[['What was the news?','Pablo finally found a job in Madrid',['Pablo was coming to dinner','The phone was broken']],['What was the mother doing during the call?','Preparing coffee',['Sleeping','Eating dinner']]]}},
  {t:'El futuro', en:'Will, and probability',
   p:{h:'One set of endings on the whole infinitive', l:[
     '<span class="ex">hablar</span> → <span class="ex">hablaré</span> · <span class="ex">hablarás</span> · <span class="ex">hablará</span> · <span class="ex">hablaremos</span> · <span class="ex">hablarán</span>. Same endings for -er and -ir: <span class="ex">comeré</span>, <span class="ex">viviré</span>.',
     'Shortened stems: <span class="ex">tener</span> → tendré · <span class="ex">poder</span> → podré · <span class="ex">hacer</span> → haré · <span class="ex">decir</span> → diré · <span class="ex">salir</span> → saldré · <span class="ex">venir</span> → vendré · <span class="ex">poner</span> → pondré · <span class="ex">saber</span> → sabré · <span class="ex">querer</span> → querré · <span class="ex">haber</span> → habrá (there will be).',
     'Spoken Spanish often prefers <span class="ex">ir a</span> + infinitive for plans. The future tense also guesses about now: <span class="ex">¿Dónde está Ana? Estará en casa.</span> (She’s probably at home.)',
     'Signal words: <span class="ex">la próxima semana</span>, <span class="ex">el año que viene</span>, <span class="ex">pronto</span>.'],
     cf:'Italian parlerò / avrò, Portuguese falarei / terei. All three built the future from infinitive + “have” (habeō): hablar + he → hablaré.'},
   w:[['la próxima semana','next week'],['el año que viene','next year'],['pronto','soon'],['probablemente','probably'],['quizás','maybe'],['el plan','the plan'],['cambiar','to change'],['seguir','to continue, to follow'],['conseguir','to get, to obtain'],['el jefe','the boss']],
   s:[['Mañana hablaré con el jefe.','Tomorrow I will speak with the boss.'],['La próxima semana tendremos tiempo.','Next week we will have time.'],['¿Qué harás el año que viene?','What will you do next year?'],['Probablemente saldré tarde.','I will probably leave late.'],['Quizás cambiaré de trabajo pronto.','Maybe I will change jobs soon.'],['¿Dónde está Ana? Estará en casa.','Where is Ana? She’s probably at home.']],
   f:[['Mañana ___ con el jefe.','hablaré',['hablo','hablaba'],'Tomorrow I will speak with the boss.'],['La próxima semana ___ tiempo.','tendremos',['teneremos','tenemos'],'Next week we will have time.'],['¿Qué ___ el año que viene?','harás',['hacerás','haces'],'What will you do next year?']],
   r:{t:'El año que viene cambiaré muchas cosas. Primero, hablaré español todos los días con mis compañeros. Seguiré estudiando latín, pero probablemente leeré más y escribiré menos. En verano viajaré a España; mi hermana vendrá conmigo. Quizás conseguiré un trabajo nuevo, pero eso no es seguro. Pronto sabremos.', q:[['Who will come to Spain with the speaker?','The speaker’s sister',['A colleague','Nobody']],['What is not certain?','Getting a new job',['Traveling in summer','Studying Latin']]]}},
  {t:'El condicional', en:'Would, could, should',
   p:{h:'Would: the future stem with imperfect endings', l:[
     '<span class="ex">hablar</span> → <span class="ex">hablaría</span> · <span class="ex">hablarías</span> · <span class="ex">hablaría</span> · <span class="ex">hablaríamos</span> · <span class="ex">hablarían</span>. Same irregular stems as the future: <span class="ex">tendría</span>, <span class="ex">podría</span>, <span class="ex">haría</span>, <span class="ex">diría</span>, <span class="ex">saldría</span>.',
     'Politeness: <span class="ex">¿Podrías ayudarme?</span> · <span class="ex">Me gustaría un café.</span> · <span class="ex">¿Qué harías tú?</span>',
     'Hypotheticals: <span class="ex">Con más tiempo, viajaría más.</span> Reported future: <span class="ex">Dijo que vendría.</span>',
     '<span class="ex">deber</span> in the conditional = should: <span class="ex">Deberías dormir más.</span>'],
     cf:'Italian parlerei / vorrei, Portuguese falaria / gostaria. Italian vorrei un caffè is Spanish me gustaría un café.'},
   w:[['me gustaría','I would like'],['deber','should, to owe'],['la oportunidad','the opportunity'],['el consejo','the advice'],['aceptar','to accept'],['elegir','to choose'],['la decisión','the decision'],['en tu lugar','in your place'],['tal vez','perhaps'],['sin','without']],
   s:[['Me gustaría viajar a Italia.','I would like to travel to Italy.'],['¿Podrías ayudarme con esto?','Could you help me with this?'],['En tu lugar, yo elegiría el otro trabajo.','In your place, I would choose the other job.'],['Deberías dormir más.','You should sleep more.'],['Dijo que vendría a las ocho.','He said he would come at eight.'],['Sin tu consejo, no sabría qué hacer.','Without your advice, I wouldn’t know what to do.']],
   f:[['Me ___ viajar a Italia.','gustaría',['gusta','gustaré'],'I would like to travel to Italy.'],['___ dormir más.','Deberías',['Debes','Deberás'],'You should sleep more.'],['Dijo que ___ a las ocho.','vendría',['vendrá','viene'],'He said he would come at eight.']],
   r:{t:'Mi amigo tiene una decisión difícil: le ofrecen un trabajo en otra ciudad. Me pidió un consejo. Le dije que, en su lugar, yo aceptaría la oportunidad, pero que debería hablar primero con su familia. Él dijo que lo pensaría y que me llamaría el viernes. Tal vez elegiría quedarse; sin su familia, no sería feliz.', q:[['What did the speaker advise?','Accept the job but talk to the family first',['Refuse the job','Move immediately']],['When will the friend call back?','On Friday',['Tomorrow','Next week']]]}},
  {t:'El presente perfecto', en:'What has happened',
   p:{h:'Haber + participle', l:[
     '<span class="ex">haber</span>: <span class="ex">he</span> · <span class="ex">has</span> · <span class="ex">ha</span> · <span class="ex">hemos</span> · <span class="ex">han</span> + participle: -ar → <span class="ex">-ado</span> (hablado), -er / -ir → <span class="ex">-ido</span> (comido, vivido).',
     'Irregular participles: <span class="ex">hecho</span> (hacer) · <span class="ex">dicho</span> (decir) · <span class="ex">visto</span> (ver) · <span class="ex">escrito</span> (escribir) · <span class="ex">puesto</span> (poner) · <span class="ex">vuelto</span> (volver) · <span class="ex">abierto</span> (abrir) · <span class="ex">muerto</span> (morir).',
     'Nothing goes between haber and the participle; pronouns go in front: <span class="ex">Lo he visto. Nunca lo he hecho.</span>',
     'Signal words: <span class="ex">ya</span>, <span class="ex">todavía no</span>, <span class="ex">alguna vez</span>, <span class="ex">nunca</span>, <span class="ex">esta semana</span>. Spain uses it for today’s events (<span class="ex">Hoy he comido tarde</span>); Latin America prefers the preterite there.'],
     cf:'Italian ho parlato is the everyday past. Portuguese tenho falado means a repeated recent action, not a single one. Participles match: fatto / feito, detto / dito, visto / visto.'},
   w:[['alguna vez','ever, at some time'],['todavía no','not yet'],['volver','to return'],['romper','to break'],['perder','to lose'],['olvidar','to forget'],['la llave','the key'],['el error','the mistake'],['últimamente','lately'],['la reunión','the meeting']],
   s:[['¿Has estado alguna vez en México?','Have you ever been to Mexico?'],['Todavía no he terminado el libro.','I haven’t finished the book yet.'],['He perdido las llaves otra vez.','I have lost the keys again.'],['Mi hermano ha vuelto de España.','My brother has come back from Spain.'],['Nunca he visto esa película.','I have never seen that film.'],['Últimamente hemos hecho muchos errores.','Lately we have made many mistakes.']],
   f:[['¿___ estado alguna vez en México?','Has',['Habes','Eres'],'Have you ever been to Mexico?'],['Todavía no he ___ el libro.','terminado',['terminé','termino'],'I haven’t finished the book yet.'],['Nunca he ___ esa película.','visto',['veído','vi'],'I have never seen that film.']],
   r:{t:'Esta semana ha sido larga. He trabajado mucho, he perdido las llaves dos veces y he olvidado una reunión importante. Pero también he hecho cosas buenas: he escrito tres cartas a mis abuelos y he vuelto a leer en español cada noche. ¿Has tenido alguna vez una semana así? Todavía no ha terminado, pero ya quiero el fin de semana.', q:[['How many times did the speaker lose the keys?','Twice',['Once','Three times']],['What good things did the speaker do?','Wrote letters and read in Spanish',['Went to a meeting','Visited the grandparents']]]}},
  {t:'Por y para', en:'Two words for “for”',
   p:{h:'Para points forward; por explains the route or the reason', l:[
     '<span class="ex">para</span> = purpose, destination, deadline, recipient: <span class="ex">Estudio para aprender. Salgo para Madrid. Es para ti. Para el lunes.</span>',
     '<span class="ex">por</span> = cause, exchange, duration, movement through, means: <span class="ex">Gracias por todo. Pagué diez euros por el libro. Caminé por el parque. Por la mañana. Por teléfono.</span>',
     'Fixed phrases: <span class="ex">por favor</span>, <span class="ex">por fin</span>, <span class="ex">por eso</span> (that’s why), <span class="ex">por ejemplo</span>, <span class="ex">por supuesto</span> (of course), <span class="ex">para siempre</span>.',
     'Test: “in order to” → para. “Because of / in exchange for / through” → por.'],
     cf:'Portuguese por / para split the same way. Italian uses per for both, which is why Italians find this pair hard.'},
   w:[['por eso','that’s why'],['por ejemplo','for example'],['por supuesto','of course'],['para siempre','forever'],['pagar','to pay'],['el euro','the euro'],['el parque','the park'],['caminar','to walk'],['la ayuda','the help'],['el centro','the center, downtown']],
   s:[['Estudio español para hablar con mis amigos.','I study Spanish to speak with my friends.'],['Gracias por tu ayuda.','Thanks for your help.'],['Pagué veinte euros por el libro.','I paid twenty euros for the book.'],['Este regalo es para ti.','This gift is for you.'],['Caminamos por el parque por la tarde.','We walked through the park in the afternoon.'],['Trabajo mucho; por eso estoy cansado.','I work a lot; that’s why I’m tired.']],
   f:[['Estudio español ___ hablar con mis amigos.','para',['por','a'],'I study Spanish to speak with my friends.'],['Gracias ___ tu ayuda.','por',['para','de'],'Thanks for your help.'],['Este regalo es ___ ti.','para',['por','a'],'This gift is for you.']],
   r:{t:'Salgo para Madrid el lunes por la mañana. Voy por trabajo, pero también para ver a mi amigo Pablo. Pagué trescientos dólares por el billete; por eso no tengo mucho dinero para regalos. Por supuesto, caminaré por el centro cada tarde. Para mí, Madrid es la mejor ciudad para practicar español.', q:[['Why is the speaker going to Madrid?','For work, and to see a friend',['For a party','To study at a school']],['Why doesn’t the speaker have money for gifts?','The ticket cost three hundred dollars',['He lost his wallet','He paid for a hotel']]]}},
  {t:'Mandatos', en:'Telling people what to do',
   p:{h:'Tú commands use the he/she form; usted uses the subjunctive', l:[
     'Tú affirmative = the él/ella present form: <span class="ex">habla</span>, <span class="ex">come</span>, <span class="ex">escribe</span>. Eight irregulars: <span class="ex">ven</span> (venir) · <span class="ex">ten</span> (tener) · <span class="ex">haz</span> (hacer) · <span class="ex">di</span> (decir) · <span class="ex">pon</span> (poner) · <span class="ex">sal</span> (salir) · <span class="ex">sé</span> (ser) · <span class="ex">ve</span> (ir).',
     'Tú negative uses the subjunctive: <span class="ex">no hables</span>, <span class="ex">no comas</span>, <span class="ex">no vengas</span>.',
     'Usted (formal): <span class="ex">hable</span>, <span class="ex">coma</span>, <span class="ex">escriba</span>, <span class="ex">venga</span>; negative just adds no. Ustedes: <span class="ex">hablen</span>.',
     'Pronouns attach to affirmative commands (<span class="ex">dime</span>, <span class="ex">levántate</span>, <span class="ex">hazlo</span>) and go before negative ones (<span class="ex">no me digas</span>, <span class="ex">no lo hagas</span>).'],
     cf:'Italian parla! / non parlare! and Portuguese fala! / não fale! The Latin imperative (amā!) is behind all the affirmative tú forms.'},
   w:[['escuchar','to listen'],['cerrar','to close'],['traer','to bring'],['girar','to turn'],['a la derecha','to the right'],['a la izquierda','to the left'],['despacio','slowly'],['tener cuidado','to be careful'],['recto','straight ahead'],['la esquina','the corner']],
   s:[['Escucha y repite.','Listen and repeat.'],['Gira a la derecha en la esquina.','Turn right at the corner.'],['Ven aquí, por favor.','Come here, please.'],['No hables tan rápido; habla despacio.','Don’t speak so fast; speak slowly.'],['Tráigame la cuenta, por favor.','Bring me the bill, please.'],['Ten cuidado y cierra la puerta.','Be careful and close the door.']],
   f:[['___ aquí, por favor.','Ven',['Viene','Venir'],'Come here, please.'],['No ___ tan rápido.','hables',['habla','hablas'],'Don’t speak so fast.'],['___ la cuenta, por favor.','Tráigame',['Me traiga','Traerme'],'Bring me the bill, please (formal).']],
   r:{t:'Perdone, ¿sabe dónde está la estación? — Sí. Siga recto dos calles y gire a la izquierda en la esquina. Tenga cuidado: la calle es grande. — Gracias. — ¡Oiga, espere! No vaya por el parque; está cerrado hoy. Vaya por la calle Mayor.', q:[['Where should the traveler turn?','Left at the corner',['Right at the corner','At the park']],['Why shouldn’t the traveler go through the park?','It is closed today',['It is dangerous','It is far']]]}},
  {t:'El subjuntivo I', en:'Wanting, needing and hoping of others',
   p:{h:'The subjunctive: swap the vowel', l:[
     '-ar verbs take -e endings: <span class="ex">hable</span> · <span class="ex">hables</span> · <span class="ex">hable</span> · <span class="ex">hablemos</span> · <span class="ex">hablen</span>. -er / -ir take -a: <span class="ex">coma</span> · <span class="ex">comas</span> · <span class="ex">coma</span> · <span class="ex">comamos</span> · <span class="ex">coman</span>.',
     'Build it from the yo form: tengo → <span class="ex">tenga</span> · hago → <span class="ex">haga</span> · conozco → <span class="ex">conozca</span> · digo → <span class="ex">diga</span>. Six irregulars: <span class="ex">sea</span> (ser) · <span class="ex">vaya</span> (ir) · <span class="ex">haya</span> (haber) · <span class="ex">sepa</span> (saber) · <span class="ex">dé</span> (dar) · <span class="ex">esté</span> (estar).',
     'Use it after que when one subject wants, needs or hopes something of another: <span class="ex">Quiero que vengas. Es importante que estudies. Espero que estés bien.</span>',
     'Same subject → infinitive, no que: <span class="ex">Quiero venir.</span>'],
     cf:'Italian voglio che tu venga, Portuguese quero que você venha. Portuguese keeps the subjunctive even more alive than Spanish.'},
   w:[['esperar que','to hope that'],['es importante que','it is important that'],['es necesario que','it is necessary that'],['es posible que','it is possible that'],['pedir','to ask for, to request'],['recomendar','to recommend'],['la salud','the health'],['descansar','to rest'],['cuidar','to take care of'],['a tiempo','on time']],
   s:[['Quiero que vengas a la fiesta.','I want you to come to the party.'],['Es importante que estudies cada día.','It is important that you study every day.'],['Espero que estés bien.','I hope you are well.'],['Mi madre quiere que descanse más.','My mother wants me to rest more.'],['Es necesario que lleguemos a tiempo.','We need to arrive on time.'],['Te recomiendo que leas este libro.','I recommend that you read this book.']],
   f:[['Quiero que ___ a la fiesta.','vengas',['vienes','venir'],'I want you to come to the party.'],['Espero que ___ bien.','estés',['estás','eres'],'I hope you are well.'],['Es necesario que ___ a tiempo.','lleguemos',['llegamos','llegar'],'We need to arrive on time.']],
   r:{t:'Mi jefe quiere que la reunión empiece a las ocho. Es importante que todos lleguemos a tiempo y que traigamos las preguntas preparadas. Mi madre, en cambio, quiere que descanse más y que no trabaje tanto; dice que es necesario que cuide la salud. Espero que las dos cosas sean posibles.', q:[['What does the boss want?','The meeting to start at eight with everyone on time',['Everyone to rest more','Fewer questions']],['What does the mother say is necessary?','Taking care of health',['Working more','Arriving early']]]}},
  {t:'El subjuntivo II', en:'Doubt, emotion, purpose, and cuando',
   p:{h:'Where the indicative stops and the subjunctive begins', l:[
     'Doubt or denial: <span class="ex">No creo que sea verdad. Dudo que venga.</span> But belief → indicative: <span class="ex">Creo que es verdad.</span>',
     'Emotion: <span class="ex">Me alegro de que estés aquí. Siento que no puedas venir. Es una lástima que…</span>',
     'Purpose: <span class="ex">para que</span> + subjunctive: <span class="ex">Te lo explico para que entiendas.</span>',
     'Future time: <span class="ex">cuando</span> + subjunctive when it hasn’t happened yet: <span class="ex">Cuando llegues, llámame.</span> Habitual → indicative: <span class="ex">Cuando llego, como.</span> <span class="ex">Ojalá</span> (+ subjunctive) = I hope.'],
     cf:'Italian non credo che sia, Portuguese não acho que seja. Portuguese adds a future subjunctive (quando chegar) where Spanish uses the present (cuando llegues).'},
   w:[['dudar','to doubt'],['alegrarse de','to be glad about'],['sentir','to be sorry, to feel'],['la lástima','the pity'],['para que','so that'],['ojalá','hopefully, I hope'],['aunque','although'],['tan pronto como','as soon as'],['la suerte','the luck'],['el avión','the plane']],
   s:[['No creo que sea verdad.','I don’t think it is true.'],['Me alegro de que estés aquí.','I am glad you are here.'],['Cuando llegues, llámame.','When you arrive, call me.'],['Te lo explico para que entiendas.','I am explaining it so that you understand.'],['Ojalá tengamos suerte.','I hope we are lucky.'],['Es una lástima que no puedas venir.','It is a pity you can’t come.']],
   f:[['No creo que ___ verdad.','sea',['es','será'],'I don’t think it is true.'],['Cuando ___, llámame.','llegues',['llegas','llegar'],'When you arrive, call me.'],['Me alegro de que ___ aquí.','estés',['estás','estar'],'I am glad you are here.']],
   r:{t:'Mi hermana viaja a Roma la próxima semana. Me alegro de que por fin tenga la oportunidad, aunque dudo que hable mucho italiano todavía. Le di un libro para que practique en el avión. Cuando llegue, me llamará. Ojalá tenga buen tiempo; es una lástima que yo no pueda ir con ella.', q:[['What does the speaker doubt?','That the sister speaks much Italian yet',['That she will arrive','That she has a book']],['Why did the speaker give her a book?','So she can practice on the plane',['As a birthday gift','To read in Rome']]]}},
  {t:'Tener, dar, hacer', en:'States you “have”, and time with hace',
   p:{h:'Spanish has hunger, sleep and fear; it doesn’t “be” them', l:[
     '<span class="ex">tener</span> + noun: <span class="ex">tener hambre</span> (hungry) · <span class="ex">sed</span> (thirsty) · <span class="ex">sueño</span> (sleepy) · <span class="ex">prisa</span> (in a hurry) · <span class="ex">miedo</span> (afraid) · <span class="ex">frío / calor</span> · <span class="ex">razón</span> · <span class="ex">suerte</span> · <span class="ex">X años</span>. Use mucho / mucha, never muy: <span class="ex">tengo mucha hambre</span>.',
     '<span class="ex">hace</span> + time + <span class="ex">que</span> + present = for: <span class="ex">Hace dos años que vivo aquí.</span> <span class="ex">hace una hora</span> alone = an hour ago.',
     '<span class="ex">dar</span>: <span class="ex">dar un paseo</span> (take a walk) · <span class="ex">dar las gracias</span> · <span class="ex">dar miedo</span> (to scare) · <span class="ex">darse cuenta de</span> (to realize).',
     '<span class="ex">tener que</span> + infinitive = to have to: <span class="ex">Tengo que irme.</span>'],
     cf:'Italian ho fame / ho sonno, Portuguese tenho fome / estou com sono. Hace dos años que = Italian da due anni, Portuguese há dois anos.'},
   w:[['tener hambre','to be hungry'],['tener sed','to be thirsty'],['tener sueño','to be sleepy'],['tener prisa','to be in a hurry'],['tener miedo','to be afraid'],['dar un paseo','to take a walk'],['darse cuenta de','to realize'],['tener que','to have to'],['la gente','the people'],['la paciencia','the patience']],
   s:[['Tengo mucha hambre y un poco de sed.','I am very hungry and a little thirsty.'],['Hace dos años que vivo en Nueva York.','I have lived in New York for two years.'],['Tengo prisa; tengo que irme.','I am in a hurry; I have to go.'],['Vamos a dar un paseo por el parque.','Let’s take a walk through the park.'],['Me di cuenta de que tenía razón.','I realized that she was right.'],['Mi hermana tiene miedo de los aviones.','My sister is afraid of planes.']],
   f:[['Tengo mucha ___.','hambre',['hambriento','comida'],'I am very hungry.'],['___ dos años que vivo en Nueva York.','Hace',['Hay','Desde'],'I have lived in New York for two years.'],['Me di ___ de que tenía razón.','cuenta',['razón','cuento'],'I realized that she was right.']],
   r:{t:'Hace tres meses que estudio español en serio. Al principio tenía miedo de hablar, pero me di cuenta de que la gente tiene paciencia. Ahora, cuando tengo sueño después del trabajo, doy un paseo y escucho un podcast en español. Tengo que practicar más la escritura, pero no tengo prisa: hace poco empecé y ya entiendo mucho.', q:[['What did the speaker realize?','People are patient',['Spanish is hard','He had no time']],['What does the speaker do when sleepy after work?','Takes a walk and listens to a Spanish podcast',['Sleeps','Writes letters']]]}},
  {t:'Que, donde y se', en:'Relative clauses and the impersonal se',
   p:{h:'Que joins sentences; se hides the actor', l:[
     '<span class="ex">que</span> = that / which / who, for things and people: <span class="ex">El libro que leo. La mujer que vino.</span> <span class="ex">quien</span> after a preposition, for people: <span class="ex">la amiga con quien hablo</span>. <span class="ex">donde</span> for places. <span class="ex">lo que</span> = what: <span class="ex">No entiendo lo que dices.</span>',
     'Impersonal se: <span class="ex">Se habla español.</span> (Spanish is spoken.) <span class="ex">Aquí se come bien.</span> The verb agrees with the thing: <span class="ex">Se venden libros.</span>',
     'Accidental se: <span class="ex">Se me olvidó la llave.</span> (The key got forgotten on me.) <span class="ex">Se me rompió el vaso.</span>',
     '<span class="ex">cuyo</span> (whose) is rare in speech; say <span class="ex">que tiene</span> instead.'],
     cf:'Italian si parla italiano, Portuguese fala-se português. The same Latin reflexive sē doing impersonal duty in all three.'},
   w:[['lo que','what, that which'],['quien','who, whom'],['donde','where (relative)'],['el vaso','the glass'],['la tienda','the shop'],['el dueño','the owner'],['vender','to sell'],['usado','used, second-hand'],['permitir','to allow'],['la cartera','the wallet']],
   s:[['El libro que leo es de un autor español.','The book I am reading is by a Spanish author.'],['No entiendo lo que dices.','I don’t understand what you are saying.'],['La ciudad donde vivo es grande.','The city where I live is big.'],['Aquí se habla español.','Spanish is spoken here.'],['En esa tienda se venden libros usados.','Used books are sold in that shop.'],['Se me olvidaron las llaves en casa.','I left the keys at home.']],
   f:[['No entiendo ___ dices.','lo que',['que','cual'],'I don’t understand what you are saying.'],['Aquí ___ habla español.','se',['es','le'],'Spanish is spoken here.'],['En esa tienda ___ libros usados.','se venden',['se vende','venden se'],'Used books are sold in that shop.']],
   r:{t:'La tienda donde compro mis libros está en una calle pequeña. Se venden libros usados y se habla de todo con el dueño, un hombre con quien me gusta conversar. Lo que más me gusta es que se permite leer sin comprar. Ayer se me olvidó la cartera en casa, pero el dueño me dijo: "Pague mañana." Esa es la gente que hace que un idioma valga la pena.', q:[['What does the speaker like most about the shop?','You are allowed to read without buying',['The low prices','The location']],['What happened yesterday?','The speaker forgot their wallet at home',['The shop was closed','A book was sold out']]]}},
  {t:'Conectar ideas', en:'Argument and opinion',
   p:{h:'Connectors turn sentences into an argument', l:[

it: { name:'Italian', native:'Italiano', note:'Standard Italian', lang:'it', levels:[{units:[

function retention7(){
  let ok = 0, n = 0; const cut = Date.now() - 7*DAY;
  for (const d in S.log){ const [y,m,dd] = d.split('-').map(Number); if (new Date(y,m-1,dd).getTime() >= cut){ ok += S.log[d].ok; n += S.log[d].n; } }
  return n >= 10 ? Math.round(ok/n*100) : null;
}
function curLevel(code){
  const C = COURSES[code];
  for (let li = 0; li < C.levels.length; li++){
    const U = C.levels[li].units;
    if (U.some((u,ui) => [0,1,2,3].some(l => !S.done[code][`${li}-${ui}-${l}`]))) return li;
  }
  return C.levels.length - 1;
}
function nextLesson(code, li){
  const U = COURSES[code].levels[li].units;
  for (let ui = 0; ui < U.length; ui++) for (let l = 0; l < 4; l++) if (!S.done[code][`${li}-${ui}-${l}`]) return [li, ui, l];
  return null;
}

/* Speech */
let voices = [];
const canSpeak = 'speechSynthesis' in window;
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if (canSpeak){ loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e){} }
function voiceFor(code){
  const tag = SPEECH[code].toLowerCase(), pre = tag.slice(0,2);
  return voices.find(v => (v.lang||'').toLowerCase().replace('_','-') === tag) || voices.find(v => (v.lang||'').toLowerCase().startsWith(pre)) || null;
}
const hasVoice = code => canSpeak && !!voiceFor(code);
function speak(text, code, slow){
  if (!canSpeak || !text) return;
  try {
    speechSynthesis.cancel();
    let t = text.replace(/___/g,' ');
    if (code === 'la') t = stripAcc(t);
    const u = new SpeechSynthesisUtterance(t);
    u.lang = SPEECH[code]; const v = voiceFor(code); if (v) u.voice = v;
    u.rate = slow ? 0.6 : 0.92;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* Exercise builders */
function opts(correct, pool, n=3){
  const used = new Set([norm(correct)]), out = [];
  for (const p of shuffle(pool)){ const k = norm(p); if (!used.has(k)){ used.add(k); out.push(p); if (out.length >= n) break; } }
  return shuffle([correct, ...out]);
}
function mkMC(C, w, dir, isNew){
  const f = dir === 't2e' ? 'en' : 't';
  let o = opts(w[f], unitWords(C,w).filter(x=>x!==w).map(x=>x[f]));
  if (o.length < 4) o = opts(w[f], C.allWords.filter(x=>x!==w).map(x=>x[f]));
  return {k:'mc', dir, item:w, isNew:!!isNew, opts:o, ans:w[f]};
}
const mkListen = (C,w) => ({k:'listen', item:w, opts:opts(w.t, unitWords(C,w).filter(x=>x!==w).map(x=>x.t)), ans:w.t});
const mkType = w => ({k:'type', item:w});
const mkMatch = ws => ({k:'match', items:ws});
const mkFill = f => ({k:'fill', item:f, opts:shuffle([f.ans, ...f.dis]), ans:f.ans});
const mkFree = s => ({k:'free', item:s, ans:s.t});
const mkDict = s => ({k:'dict', item:s, ans:s.t});
const mkSpeak = it => ({k:'speak', item:it, ans:it.t});
const mkRead = (U, qi) => ({k:'read', U, q:U.r.q[qi], opts:shuffle([U.r.q[qi][1], ...U.r.q[qi][2]]), ans:U.r.q[qi][1], item:null});
const mkPattern = U => ({k:'pattern', U, item:null});
function mkBuild(C, s, dir){
  const ans = dir === 't2e' ? s.en : s.t, toks = tokens(ans);
  const inAns = new Set(toks.map(norm));
  const src = dir === 't2e' ? C.allSents.map(x=>x.en) : C.allSents.map(x=>x.t);
  const pool = src.flatMap(tokens).filter(t => !inAns.has(norm(t)) && !(dir==='t2e' && /^(a|an|the)$/i.test(t)));
  const uniq = [...new Map(pool.map(t => [norm(t), t])).values()];
  const dis = shuffle(uniq).slice(0, toks.length <= 4 ? 3 : 2);
  return {k:'build', dir, item:s, tiles:shuffle([...toks, ...dis]).map((text,id) => ({id,text})), ans};
}
const STRONG = {type:1, fill:1, dict:1, speak:1, free:1};
const isStrong = ex => !!STRONG[ex.k] || (ex.k === 'build' && ex.dir === 'e2t');

function buildLesson(code, li, ui, l){
  const C = COURSES[code], U = C.levels[li].units[ui], V = hasVoice(code), seq = [];
  if (l < 2){
    const nw = U.words.slice(l*5, l*5+5), [a,b,c,d,e] = nw;
    if (l === 0) seq.push(mkPattern(U));
    // expanding spacing: each new word is introduced, typed two items later, matched, then typed again
    seq.push(mkMC(C,a,'t2e',!seen(a)), mkMC(C,b,'t2e',!seen(b)), mkType(a), mkMC(C,c,'t2e',!seen(c)), mkType(b),
             mkMC(C,d,'t2e',!seen(d)), mkType(c), mkMC(C,e,'t2e',!seen(e)), mkMatch(nw), mkType(d), mkType(e),
             V ? mkListen(C,a) : mkMC(C,a,'e2t'), mkSpeak(b), mkType(c));
    const rev = l === 1 ? U.words.slice(0,5) : C.allWords.filter(w => seen(w) && w.u < U.index);
    if (rev.length) seq.push(mkType(pick(rev)));
  } else if (l === 2){
    const s = U.sents, f = shuffle(U.fills);
    seq.push(mkPattern(U), mkBuild(C,s[0],'t2e'), mkFill(f[0]), mkBuild(C,s[1],'e2t'), mkFree(s[0]), mkBuild(C,s[2],'t2e'), mkFill(f[1]),
             mkSpeak(s[3]), mkBuild(C,s[3],'e2t'), mkFill(f[2]), mkBuild(C,s[4],'e2t'), V ? mkDict(s[5]) : mkBuild(C,s[5],'e2t'), mkFree(s[5]));
  } else {
    const ws = shuffle(U.words), ss = shuffle(U.sents), ff = shuffle(U.fills);
    seq.push(mkType(ws[0]), mkBuild(C,ss[0],'e2t'), mkType(ws[1]), mkFill(ff[0]), mkRead(U,0), mkRead(U,1), mkType(ws[2]), mkFree(ss[1]),
             V ? mkDict(ss[2]) : mkBuild(C,ss[2],'e2t'), mkType(ws[3]), mkFill(ff[1]), mkSpeak(ss[3]), mkFree(ss[4]), mkType(ws[4]), mkBuild(C,ss[5],'t2e'));
  }
  return seq;
}
// Test out: every word typed, free translation, cloze and reading in one 20-item pass. 85% first-try marks the unit done and seeds its items at a 7-day interval.
const TESTOUT_PASS = 0.85;
function buildTestOut(code, li, ui){
  const C = COURSES[code], U = C.levels[li].units[ui];
  const ws = shuffle(U.words), ss = shuffle(U.sents), ff = shuffle(U.fills);
  const types = ws.map(mkType), sents = [mkFree(ss[0]), mkBuild(C,ss[1],'e2t'), mkFree(ss[2]), mkBuild(C,ss[3],'e2t'), mkFree(ss[4])];
  const rest = [...sents, ...ff.map(mkFill), mkRead(U,0), mkRead(U,1)];
  const seq = [];
  types.forEach((t,i) => { seq.push(t); if (rest[i]) seq.push(rest[i]); });
  return seq;
}
function reviewEx(C, it){
  const r = Math.random();
  if (it.kind === 's') return r < .4 ? mkFree(it) : r < .8 ? mkBuild(C, it, 'e2t') : mkBuild(C, it, 't2e');
  if (it.kind === 'f') return mkFill(it);
  return r < .6 ? mkType(it) : (r < .8 && hasVoice(C.code)) ? mkListen(C, it) : mkMC(C, it, 'e2t');
}
function buildReview(code, extra){
  const C = COURSES[code];
  const pool = extra
    ? allItems(code).filter(seen).sort((a,b) => (rec(a).b - rec(b).b) || (rec(a).due - rec(b).due)).slice(0, 12)
    : dueItems(code).slice(0, REVIEW_CAP);
  if (!pool.length) return null;
  return shuffle(pool).map(it => reviewEx(C, it));
}

const GRAMMAR_CEFR = ['A1','A2','B1','B1+','B2','B2+'];
function learnerBrief(code){
  const C = COURSES[code];
  const doneUnits = C.units.filter(U => [0,1,2,3].some(l => S.done[code][`${U.lv}-${U.ui}-${l}`]));
  const maxLv = doneUnits.reduce((m,U) => Math.max(m, U.lv), 0);
  let levelsDone = 0; while (levelsDone < C.levels.length && C.levels[levelsDone].units.every(U => [0,1,2,3].every(l => S.done[code][`${U.lv}-${U.ui}-${l}`]))) levelsDone++;
  const grammar = doneUnits.map(U => U.p.h);
  const knownW = allWordsOf(code).filter(seen).map(w => w.t);
  return {C, cefr: GRAMMAR_CEFR[Math.min(Math.max(maxLv, levelsDone), GRAMMAR_CEFR.length-1)], grammar, knownW};
}
const langNote = code => code === 'la' ? 'Classical Latin with macrons on long vowels.' : code === 'pt' ? 'Brazilian Portuguese.' : code === 'es' ? 'Neutral Latin American Spanish.' : 'Standard Italian.';
const findItem = (code, t) => { const k = norm(t), kb = stripArt(k), m = w => w.kind === 'w' && (norm(w.t) === k || stripArt(norm(w.t)) === kb); return extraItems(code).find(m) || COURSES[code].allWords.find(m) || null; };
function sampleErr(e){

  return 'Couldn’t reach Claude. Try again in a moment.';
}

let readCtl = null;
async function generatePassage(topic){
  const code = S.lang, {C, cefr, grammar, knownW} = learnerBrief(code);
  if (!sampleNS) return toast('Reading needs the Claude version of this app.');
  closeSheet(); screen = 'busy';
  app.innerHTML = `<div class="wrap endscr"><h1>Writing your passage</h1><p class="lead">${esc(C.name)} · ${esc(topic)} · about ${cefr}. Claude is writing from the ${knownW.length} words you know plus five new ones. Usually 10–40 seconds.</p>
    <div class="row"><button class="btn btn-line" data-act="readcancel">Cancel</button></div></div>`;
  readCtl = new AbortController();
  const prompt = `Write a reading passage for a learner of ${C.name}. ${langNote(code)}
Learner: grammar at about CEFR ${cefr}. Patterns studied: ${grammar.length ? grammar.join('; ') : 'beginner basics'}.
Words the learner knows (use freely): ${knownW.length ? knownW.join(', ') : 'very few; keep it simple'}.
Topic: ${topic}.
Requirements:
- 150 to 200 words, 2 or 3 short paragraphs separated by a blank line, natural ${C.name} at that level. Use the known words as much as possible.
- Introduce exactly 5 new useful high-frequency words (not names, not words in the known list), each used at least twice in the passage.
- 3 comprehension questions in English, each with one correct answer and two plausible wrong answers, all short.
- gloss: an object mapping EVERY distinct word in the passage (lowercase, punctuation stripped, exactly as spelled in the text, inflected forms included) to a short English meaning; names map to "(name)".
Return only JSON: {"title": string, "text": string, "new": [{"w": string, "en": string}], "q": [{"q": string, "a": string, "dis": [string, string]}], "gloss": {string: string}}`;
  try {
    const res = await sampleNS.json(prompt, {modelTier:'default', cache:false, signal: readCtl.signal});
    if (screen !== 'busy') return;
    if (!res || typeof res.text !== 'string' || !Array.isArray(res.new) || !Array.isArray(res.q) || res.q.length < 2) throw {code:'invalid_json'};
    const gloss = {}; for (const k in (res.gloss||{})) gloss[clean(k)] = String(res.gloss[k]).slice(0,60);
    const neww = res.new.slice(0,5).map(x => ({t:String(x.w||'').trim(), en:String(x.en||'').trim()})).filter(x => x.t && x.en);
    const P = {title:String(res.title||topic).slice(0,80), text:res.text.trim(), topic, gloss, neww, q:res.q.slice(0,3).map(x => [String(x.q), String(x.a), (x.dis||[]).slice(0,2).map(String)]), at:Date.now()};
    neww.forEach(w => { addExtra(code, w.t, w.en, 'w', 'reader'); gloss[clean(w.t)] = gloss[clean(w.t)] || w.en; });
    S.readings[code].unshift(P); if (S.readings[code].length > 10) S.readings[code].length = 10;
    save(true);
    startSession('reader', P);
  } catch(e){
    if (e && e.name === 'AbortError') return;
    toast(sampleErr(e)); renderHome();
  }
}
function buildReaderSession(code, P){
  const C = COURSES[code];
  const items = P.neww.map(w => findItem(code, w.t)).filter(Boolean);
  const U = {r:{t:P.text, q:P.q}, ui:0};
  const seq = [{k:'passage', P, item:null}];
  P.q.forEach((_,i) => seq.push(mkRead(U, i)));
  items.forEach((w,i) => { seq.push(mkMC(C, w, 't2e', !seen(w))); if (i >= 1) seq.push(mkType(items[i-1])); });
  if (items.length) seq.push(mkType(items[items.length-1]));
  return seq;
}

function chatBrief(code, sc){
  const {C, cefr, grammar, knownW} = learnerBrief(code);
  return `You are a ${C.name} conversation partner for a learner. ${langNote(code)}
Learner: grammar at about CEFR ${cefr}. Patterns studied: ${grammar.length ? grammar.join('; ') : 'beginner basics'}. Vocabulary they know includes: ${knownW.slice(0,150).join(', ') || 'very little'}.

Rules: write only in ${C.name}, 1 to 3 short sentences per turn, at or just above the learner's level, and end every turn with a question or a prompt. Stay in character. Recycle the patterns they have studied. If the learner writes in English, answer briefly in ${C.name} and invite them to try in ${C.name}.

Always answer with JSON only: {"reply": string, "ok": boolean, "fix": string, "note": string, "en": string}`;
}

function drawChat(){
  const lg = COURSES[CH.code].lang, el = $('#msgs'); if (!el) return;
  el.innerHTML = CH.msgs.map(m => m.who === 'ai'
    ? `<div class="bub ai" lang="${lg}">${esc(m.text)}${canSpeak ? ` <button class="spk sm" style="display:inline-grid;vertical-align:middle;margin-left:6px" data-act="say" data-say="${esc(m.text)}" aria-label="Play">${I.spk}</button>` : ''}</div>`
    : `<div class="bub me" lang="${lg}">${esc(m.text)}</div>${m.checked ? (m.ok ? `<div class="fix good">${I.check} Correct</div>` : `<div class="fix"><b lang="${lg}">${esc(m.fix)}</b> · ${esc(m.note)}${m.added ? ' · added to review' : ''}</div>`) : ''}`
  ).join('') + (CH.busy ? `<div class="bub ai typing">…</div>` : '');

async function chatCall(){
  CH.busy = true; drawChat();
  const send = $('#csend'); if (send) send.disabled = true;
  let turns = CH.turns.slice(); while (turns.length > 41) turns.splice(1, 2);
  turns = turns.map((t,i) => i === turns.length-1 && i > 0 ? {role:t.role, content: t.content + '\n\n(JSON only, in the format given at the start.)'} : t);
  try {
    const res = await sampleNS.json(turns, {modelTier:'quick', cache:false});
    if (screen !== 'chat') return;
    const reply = res && typeof res.reply === 'string' ? res.reply.trim() : '';
    if (!reply) throw {code:'invalid_json'};
    const last = CH.msgs[CH.msgs.length-1];
    if (last && last.who === 'me' && !last.checked){
      last.checked = true; last.ok = res.ok !== false || !res.fix;
      if (!last.ok){
        last.fix = String(res.fix||'').trim(); last.note = String(res.note||'').trim(); last.en = String(res.en||'').trim();
        CH.corrections.push({orig:last.text, fix:last.fix, note:last.note, en:last.en});
        if (last.fix && last.en && addExtra(CH.code, last.fix, last.en, 's', 'chat')){ last.added = true; CH.added++; }
      }
    }
    CH.turns.push({role:'assistant', content: reply});
    CH.msgs.push({who:'ai', text: reply});
    if (S.audio) speak(reply, CH.code);
    save();
  } catch(e){
    if (e && e.code === 'not_granted'){ toast(sampleErr(e)); return renderHome(); }
    toast(sampleErr(e));
    // drop the unanswered learner turn so the transcript stays user/assistant alternating
    if (CH.turns.length > 1 && CH.turns[CH.turns.length-1].role === 'user'){ CH.turns.pop(); const m = CH.msgs.pop(); const inp = $('#cin'); if (inp && m) inp.value = m.text; }
  } finally {
    CH.busy = false; drawChat();
    const s2 = $('#csend'); if (s2) s2.disabled = false;
    const inp = $('#cin'); if (inp && matchMedia('(pointer:fine)').matches) inp.focus();
  }
}
function chatSend(){
  if (!CH || CH.busy) return;
  const inp = $('#cin'), v = inp.value.trim(); if (!v) return;
  inp.value = '';
  const now = Date.now(); logTime(CH.code, Math.min(90, Math.round((now - CH.lastTick)/1000))); CH.lastTick = now;
  CH.msgs.push({who:'me', text:v, checked:false});
  CH.turns.push({role:'user', content: 'Learner: ' + v});
  chatCall();
}
function endChat(){
  if (!CH) return renderHome();
  const C = COURSES[CH.code], n = CH.msgs.filter(m => m.who === 'me').length;
  const now = Date.now(); logTime(CH.code, Math.min(90, Math.round((now - CH.lastTick)/1000))); save(true);
  screen = 'done';
  app.innerHTML = `<div class="wrap endscr">
    <h1>Conversation over</h1>
    <p class="lead">${n} message${n===1?'':'s'} from you · ${CH.corrections.length} correction${CH.corrections.length===1?'':'s'}${CH.added ? ` · ${CH.added} corrected sentence${CH.added===1?'':'s'} added to review` : ''} · ${Math.max(1, Math.round((now - CH.start)/60e3))} min</p>
    ${CH.corrections.length ? `<ul class="misses">${CH.corrections.map(c => `<li><span class="q">${esc(c.orig)}<br><small>${esc(c.note)}</small></span><span class="a" lang="${C.lang}">${esc(c.fix)}<br><small style="font-weight:400;color:var(--muted)">${esc(c.en)}</small></span></li>`).join('')}</ul>` : '<p class="lead">No corrections. Try a harder scenario, or write longer sentences.</p>'}
    <div class="row"><button class="btn" data-act="chatsheet">New conversation</button><button class="btn btn-line" data-act="home">Back to course</button></div></div>`;
  CH = null; window.scrollTo(0,0);
}

  L = {code, kind, lv, u, l, queue:q, i:0, done:0, total:q.length, misses:[], firstTry:0, start:Date.now(), lastTick:Date.now(), gloss: kind === 'reader' ? lv.gloss : null};

const cur = () => L.queue[L.i];
function setBar(){ const p = Math.round(L.done / L.total * 100); $('#bar').style.width = p + '%'; $('#track').setAttribute('aria-valuenow', p); $('#count').textContent = `${L.done}/${L.total}`; }
function glossOf(code, tok, extra){
  const k = clean(tok);
  if (extra){ const g = extra[k] ?? extra[stripAcc(k)]; if (g) return g; }
  const x = S.extra[code].find(w => (w.kind||'w') === 'w' && (clean(w.t) === k || stripArt(clean(w.t)) === k));
  if (x) return x.en;
  return COURSES[code].gloss(tok);
}
function glossTokens(text, code, extra){
  extra = extra || (L && L.gloss) || null;
  return text.split(/(\s+)/).map(part => {
    if (!part || /^\s+$/.test(part)) return part;
    if (part.includes('___')) return part.replace('___', '<span class="blank">&nbsp;</span>');
    const g = glossOf(code, part, extra);
    return g ? `<span class="gl" role="button" tabindex="0" data-act="gl" data-w="${esc(part.replace(PUNCT,''))}" data-g="${esc(g)}">${esc(part)}</span>` : esc(part);
  }).join('');
}
