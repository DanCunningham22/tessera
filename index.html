<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D55C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tessera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tessera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 600px column. Home = review card first (what's due), then units as plain lesson lists. Lesson = progress bar, exercise, fixed check bar. No game layer. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunk:#E6EAF0; --ink:#18202F; --muted:#5B677C; --line:#D5DBE4;
  --accent:#2D55C8; --accent-d:#1E3C99; --accent-t:#E3E9FA;
  --ok:#1F8A65; --ok-d:#166B4E; --ok-t:#DDF1E8;
  --bad:#BC3C35; --bad-d:#8E2A25; --bad-t:#FAE4E2;
  --on:#FFFFFF;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151E; --surface:#19202E; --sunk:#141A25; --ink:#E6EBF3; --muted:#97A3B7; --line:#2A3345;
  --accent:#6A8DF2; --accent-d:#3E5FC2; --accent-t:#1D2A4B;
  --ok:#3CBE8C; --ok-d:#258560; --ok-t:#13302A;
  --bad:#EC6B62; --bad-d:#A9443D; --bad-t:#3A1E1D;
  --on:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151E; --surface:#19202E; --sunk:#141A25; --ink:#E6EBF3; --muted:#97A3B7; --line:#2A3345;
  --accent:#6A8DF2; --accent-d:#3E5FC2; --accent-t:#1D2A4B;
  --ok:#3CBE8C; --ok-d:#258560; --ok-t:#13302A;
  --bad:#EC6B62; --bad-d:#A9443D; --bad-t:#3A1E1D;
  --on:#FFFFFF; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--on);box-shadow:0 2px 0 var(--accent-d);font-weight:600;font-size:16px}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:none}
.btn[disabled]{background:var(--sunk);box-shadow:none;color:var(--muted);cursor:default}
.btn.wide{flex:1 1 auto}
.btn-ok{background:var(--ok);box-shadow:0 2px 0 var(--ok-d)}
.btn-bad{background:var(--bad);box-shadow:0 2px 0 var(--bad-d)}
.btn-line{background:var(--surface);color:var(--accent);box-shadow:none;border:2px solid var(--line)}
.btn-line[disabled]{background:var(--surface);color:var(--muted)}
.btn-text{background:none;box-shadow:none;color:var(--muted);padding:0 8px;min-height:44px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk)}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:12px;font-weight:600;min-width:0}
.chip:hover{background:var(--sunk)}
.code{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--on);font-weight:700;font-size:13px;letter-spacing:.04em;flex:none}

.home{padding-block:20px 80px;display:flex;flex-direction:column;gap:28px}
.hero h1{font-size:clamp(26px,6vw,32px);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.fig{background:var(--surface);padding:10px 12px}
.fig b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.fig span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.card .row .btn{flex:1 1 180px}

.unit{display:flex;flex-direction:column;gap:10px}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.uhead>div{min-width:0}
.ulabel{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.uhead h2{margin:2px 0 0;font-size:20px;line-height:1.2}
.uhead h2 small{font-weight:400;color:var(--muted);font-size:15px}
.lessons{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.lrow:hover{border-color:var(--muted)}
.lrow .st{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:var(--on)}
.lrow.done .st{background:var(--ok);border-color:var(--ok)}
.lrow.next{border:2px solid var(--accent);padding:11px 13px}
.lrow .lname{font-weight:600}
.lrow .lsub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-t);padding:3px 8px;border-radius:6px}
.endlevel{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px;margin:0}

.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:20}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);max-height:86vh;overflow:auto;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sheet h3{margin:0;font-size:20px}
.sheet h4{margin:20px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p{color:var(--muted);margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.courses{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px}
.crow.on{border:2px solid var(--accent);padding:11px}
.crow b{display:block}
.crow small{color:var(--muted);font-size:13px}
.pct{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.wlist,.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wlist li{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.slist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.wt{font-weight:600}
.we,.se{color:var(--muted);font-size:14px}
.due{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.switch{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;padding:4px 0}
.switch .knob{width:50px;height:30px;border-radius:30px;background:var(--sunk);border:1px solid var(--line);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted)}
.switch[aria-checked="true"] .knob{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"] .knob::after{transform:translateX(20px);background:var(--on)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.savebadge{display:inline-flex;align-items:center;gap:8px;font-size:14px;background:var(--sunk);padding:8px 12px;border-radius:10px}
.savebadge i{width:8px;height:8px;border-radius:2px;background:var(--muted)}
.savebadge.acct i{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center}

.lesson{display:flex;flex-direction:column;min-height:100%}
.ltop{display:flex;align-items:center;gap:12px;padding-block:12px}
.track{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fillbar{height:100%;width:0;border-radius:99px;background:var(--ok);transition:width .3s ease}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
#ex{padding-block:10px 190px;display:flex;flex-direction:column;gap:20px}
#ex.locked .opt,#ex.locked .tile,#ex.locked .input,#ex.locked .acc{pointer-events:none}
.qhead{display:flex;flex-direction:column;gap:4px}
.newtag{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.qt{margin:0;font-size:20px;font-weight:600;line-height:1.25;text-wrap:balance}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-size:28px;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.sent{font-size:21px;font-weight:500;line-height:1.5;min-width:0}
.spk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-t);color:var(--accent);flex:none}
.spk.sm{width:34px;height:34px;border-radius:9px}
.spk.huge{width:88px;height:88px;border-radius:20px}
.spk.slow{width:60px;height:60px;border-radius:16px;font-size:13px;font-weight:600}
.listenrow{display:flex;align-items:flex-end;gap:16px;justify-content:center;padding-block:8px}
.gl{border-bottom:2px dotted var(--muted);cursor:pointer;padding-bottom:1px}
.gl:hover{border-bottom-color:var(--accent);color:var(--accent)}
.hint{min-height:22px;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);text-align:center}
.sub-en{color:var(--muted);font-size:15px;margin:0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;text-align:left}
.opt:hover{background:var(--sunk)}
.opt .k{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;font-size:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-t)}
.opt.right{border-color:var(--ok);background:var(--ok-t)}
.opt.wrong{border-color:var(--bad);background:var(--bad-t)}
.lines{min-height:112px;padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 55px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:9px 14px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px}
.tile.used{background:var(--sunk);border-color:var(--sunk);color:transparent;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{min-height:54px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:var(--accent-t)}
.mt.done{opacity:.35;pointer-events:none}
.mt.miss{border-color:var(--bad);background:var(--bad-t)}
.input{width:100%;font:inherit;font-size:20px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.acc{min-width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot.ok{background:var(--ok-t);border-top-color:var(--ok-t)}
.foot.bad{background:var(--bad-t);border-top-color:var(--bad-t)}
.footin{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:14px}
.footin .btn.wide{min-width:min(100%,200px)}
.foot-note{color:var(--muted);font-size:14px;flex:1;text-align:center}
.fbmsg{flex:1 1 260px;min-width:0}
.fbmsg strong{display:block;font-size:18px}
.foot.ok .fbmsg strong{color:var(--ok)}
.foot.bad .fbmsg strong{color:var(--bad)}
.fbans{font-size:17px;margin-top:2px;overflow-wrap:anywhere;font-weight:500}
.fbnote{font-size:14px;margin-top:4px;color:var(--muted)}

.endscr{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.endscr h1{margin:0;font-size:26px;line-height:1.2}
.endscr .lead{margin:0;color:var(--muted)}
.misses{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.misses li{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.misses li:last-child{border-bottom:0}
.misses .q{color:var(--muted)}
.misses .a{font-weight:600}
.endscr .row .btn{flex:1 1 180px}

.pat{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.pat .ptitle{margin:0;font-size:18px}
.pat ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.pat li{line-height:1.5}
.pat .cf{margin:0;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pat .ex{font-weight:600}
.passage{font-size:19px;line-height:1.65;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.reveal{font-size:24px;font-weight:600;min-height:40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.self{display:flex;gap:10px;flex:1 1 260px}
.self .btn{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-t)}
.est{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.checking{color:var(--muted);font-size:15px}
</style>

</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';

/* Course content. Unit: p = pattern note {h, l[], cf}; w = words [target, english, [accepted]]; s = sentences [target, english]; f = fills [sentence with ___, answer, [distractors], english]; r = passage {t, q:[[question, answer, [distractors]]]} */
const COURSES = {
la: { name:'Latin', native:'Lingua Latīna', note:'Classical, with macrons · follows Wheelock', lang:'la', levels:[{units:[
  {t:'Sum', en:'To be, and no articles',
   p:{h:'Latin has no “a” or “the”, and drops pronouns', l:[
     '<span class="ex">puella</span> means girl, a girl, or the girl. Context decides.',
     'The verb ending tells you who: <span class="ex">sum</span> I am · <span class="ex">es</span> you are · <span class="ex">est</span> he/she/it is · <span class="ex">sumus</span> we are · <span class="ex">estis</span> you all are · <span class="ex">sunt</span> they are.',
     'Word order is free; the verb usually comes last. <span class="ex">Nauta sum</span> = I am a sailor.',
     'Macrons (ā ē ī ō ū) mark long vowels. Type without them and you are still marked right.'],
     cf:'Spanish soy / es / son, Italian sono / è / sono and Portuguese sou / é / são all descend from these forms.'},
   w:[['puella','girl'],['nauta','sailor'],['poēta','poet'],['vīta','life'],['patria','fatherland'],['fortūna','fortune, luck'],['pecūnia','money'],['fāma','fame, rumor'],['et','and'],['nōn','not']],
   s:[['Nauta sum.','I am a sailor.'],['Poēta nōn es.','You are not a poet.'],['Puella est.','She is a girl.'],['Pecūnia nōn est vīta.','Money is not life.'],['Fāma et fortūna.','Fame and fortune.'],['Poēta et nauta sunt.','They are a poet and a sailor.']],
   f:[['Nauta ___.','sum',['est','es'],'I am a sailor.'],['Pecūnia ___ est vīta.','nōn',['et','sum'],'Money is not life.'],['Poēta et nauta ___.','sunt',['est','sumus'],'They are a poet and a sailor.']],
   r:{t:'Poēta sum. Patria mea Rōma est. Nauta nōn sum; pecūnia nōn est vīta.', q:[['What is the speaker?','A poet',['A sailor','A girl']],['What does the speaker say about money?','It is not life',['It is fortune','It is fame']]]}},
  {t:'Prīma dēclīnātiō', en:'First declension and -ō verbs',
   p:{h:'The ending shows the job a noun does', l:[
     'Subject (nominative): <span class="ex">puell<b>a</b></span>. Direct object (accusative): <span class="ex">puell<b>am</b></span>. <span class="ex">Puella rosam amat</span> = the girl loves the rose; <span class="ex">Rosam puella amat</span> means the same.',
     'Verbs: <span class="ex">amō</span> I love · <span class="ex">amās</span> you love · <span class="ex">amat</span> he/she loves · <span class="ex">amāmus</span> we love · <span class="ex">amātis</span> you all love · <span class="ex">amant</span> they love.',
     '<span class="ex">videō, vidēs, videt</span> (see) and <span class="ex">habeō, habēs, habet</span> (have) use the same endings on a different stem.'],
     cf:'The Spanish, Italian and Portuguese -o / -as / -a endings (hablo, hablas, habla) are these Latin endings worn down.'},
   w:[['rosa','rose'],['aqua','water'],['terra','land, earth'],['porta','gate'],['fīlia','daughter'],['amō','I love'],['laudō','I praise'],['vocō','I call'],['videō','I see'],['habeō','I have']],
   s:[['Puella rosam amat.','The girl loves the rose.'],['Nauta aquam videt.','The sailor sees the water.'],['Poēta patriam laudat.','The poet praises the fatherland.'],['Fīliam vocō.','I call my daughter.'],['Terram et aquam habēmus.','We have land and water.'],['Fortūnam nōn habeō.','I do not have luck.']],
   f:[['Puella ___ amat.','rosam',['rosa','rosae'],'The girl loves the rose.'],['Nauta aquam ___.','videt',['videō','vidēmus'],'The sailor sees the water.'],['Fīliam ___.','vocō',['vocat','vocant'],'I call my daughter.']],
   r:{t:'Nauta sum. Aquam et terram videō. Fīliam habeō; fīlia rosās amat. Patriam laudō.', q:[['What does the daughter love?','Roses',['Water','The fatherland']],['What does the sailor praise?','The fatherland',['The gate','His daughter']]]}},
  {t:'Secunda dēclīnātiō', en:'Second declension and plurals',
   p:{h:'-us and -um nouns, and how plurals form', l:[

      if (screen === 'home') renderHome();
    } else if (S.updatedAt && (!remote || S.updatedAt > (remote.updatedAt||0))) {
      pushRemote();
    }
  } catch(e) { dbRef = null; syncMode = 'local'; }
}

/* Spaced repetition. A correct typed/built answer moves an item up one box (once per day); a correct recognition answer only up to box 2; a miss drops it to box 0 and brings it back in 10 minutes. */
const rec = it => S.items[it.key];
const seen = it => !!rec(it);
function grade(it, ok, strong){
  if (!it) return;
  const now = Date.now(), t = today();
  const r = S.items[it.key] || {b:0, due:0, d:''};
  if (ok){
    if (r.d !== t && r.b < (strong ? 6 : WEAK_CAP)) r.b++;
    else if (r.b === 0) r.b = 1;
    r.due = now + INTERVALS[r.b]*DAY;
  } else { r.b = 0; r.due = now + 10*60e3; }
  r.d = t;
  S.items[it.key] = r;
}
const dueItems = code => COURSES[code].all.filter(it => { const r = rec(it); return r && r.due <= Date.now(); }).sort((a,b) => rec(a).due - rec(b).due);
const nextDue = code => { const ds = COURSES[code].all.map(rec).filter(Boolean).map(r => r.due); return ds.length ? Math.min(...ds) : null; };
const learned = code => COURSES[code].allWords.filter(w => { const r = rec(w); return r && r.b >= 1; }).length;
const solid = code => COURSES[code].allWords.filter(w => { const r = rec(w); return r && r.b >= 4; }).length;
function retention7(){
  let ok = 0, n = 0; const cut = Date.now() - 7*DAY;
  for (const d in S.log){ const [y,m,dd] = d.split('-').map(Number); if (new Date(y,m-1,dd).getTime() >= cut){ ok += S.log[d].ok; n += S.log[d].n; } }
  return n >= 10 ? Math.round(ok/n*100) : null;
}
function curLevel(code){
  const C = COURSES[code];
  for (let li = 0; li < C.levels.length; li++){
    const U = C.levels[li].units;
    if (U.some((u,ui) => [0,1,2,3].some(l => !S.done[code][`${li}-${ui}-${l}`]))) return li;
  }
  return C.levels.length - 1;
}
function nextLesson(code, li){
  const U = COURSES[code].levels[li].units;
  for (let ui = 0; ui < U.length; ui++) for (let l = 0; l < 4; l++) if (!S.done[code][`${li}-${ui}-${l}`]) return [li, ui, l];
  return null;
}

/* Speech */
let voices = [];
const canSpeak = 'speechSynthesis' in window;
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if (canSpeak){ loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e){} }
function voiceFor(code){
  const tag = SPEECH[code].toLowerCase(), pre = tag.slice(0,2);
  return voices.find(v => (v.lang||'').toLowerCase().replace('_','-') === tag) || voices.find(v => (v.lang||'').toLowerCase().startsWith(pre)) || null;
}
const hasVoice = code => canSpeak && !!voiceFor(code);
function speak(text, code, slow){
  if (!canSpeak || !text) return;
  try {
    speechSynthesis.cancel();
    let t = text.replace(/___/g,' ');
    if (code === 'la') t = stripAcc(t);
    const u = new SpeechSynthesisUtterance(t);
    u.lang = SPEECH[code]; const v = voiceFor(code); if (v) u.voice = v;
    u.rate = slow ? 0.6 : 0.92;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* Exercise builders */
function opts(correct, pool, n=3){
  const used = new Set([norm(correct)]), out = [];
  for (const p of shuffle(pool)){ const k = norm(p); if (!used.has(k)){ used.add(k); out.push(p); if (out.length >= n) break; } }
  return shuffle([correct, ...out]);
}
function mkMC(C, w, dir, isNew){
  const f = dir === 't2e' ? 'en' : 't';
  let o = opts(w[f], C.units[w.u].words.filter(x=>x!==w).map(x=>x[f]));
  if (o.length < 4) o = opts(w[f], C.allWords.filter(x=>x!==w).map(x=>x[f]));
  return {k:'mc', dir, item:w, isNew:!!isNew, opts:o, ans:w[f]};
}
const mkListen = (C,w) => ({k:'listen', item:w, opts:opts(w.t, C.units[w.u].words.filter(x=>x!==w).map(x=>x.t)), ans:w.t});
const mkType = w => ({k:'type', item:w});
const mkMatch = ws => ({k:'match', items:ws});
const mkFill = f => ({k:'fill', item:f, opts:shuffle([f.ans, ...f.dis]), ans:f.ans});
const mkFree = s => ({k:'free', item:s, ans:s.t});
const mkDict = s => ({k:'dict', item:s, ans:s.t});
const mkSpeak = it => ({k:'speak', item:it, ans:it.t});
const mkRead = (U, qi) => ({k:'read', U, q:U.r.q[qi], opts:shuffle([U.r.q[qi][1], ...U.r.q[qi][2]]), ans:U.r.q[qi][1], item:null});
const mkPattern = U => ({k:'pattern', U, item:null});
function mkBuild(C, s, dir){
  const ans = dir === 't2e' ? s.en : s.t, toks = tokens(ans);
  const inAns = new Set(toks.map(norm));
  const src = dir === 't2e' ? C.allSents.map(x=>x.en) : C.allSents.map(x=>x.t);
  const pool = src.flatMap(tokens).filter(t => !inAns.has(norm(t)) && !(dir==='t2e' && /^(a|an|the)$/i.test(t)));
  const uniq = [...new Map(pool.map(t => [norm(t), t])).values()];
  const dis = shuffle(uniq).slice(0, toks.length <= 4 ? 3 : 2);
  return {k:'build', dir, item:s, tiles:shuffle([...toks, ...dis]).map((text,id) => ({id,text})), ans};
}
const STRONG = {type:1, fill:1, dict:1, speak:1, free:1};
const isStrong = ex => !!STRONG[ex.k] || (ex.k === 'build' && ex.dir === 'e2t');

function buildLesson(code, li, ui, l){
  const C = COURSES[code], U = C.levels[li].units[ui], V = hasVoice(code), seq = [];
  if (l < 2){
    const nw = U.words.slice(l*5, l*5+5), [a,b,c,d,e] = nw;
    if (l === 0) seq.push(mkPattern(U));
    // expanding spacing: each new word is introduced, typed two items later, matched, then typed again
    seq.push(mkMC(C,a,'t2e',!seen(a)), mkMC(C,b,'t2e',!seen(b)), mkType(a), mkMC(C,c,'t2e',!seen(c)), mkType(b),
             mkMC(C,d,'t2e',!seen(d)), mkType(c), mkMC(C,e,'t2e',!seen(e)), mkMatch(nw), mkType(d), mkType(e),
             V ? mkListen(C,a) : mkMC(C,a,'e2t'), mkSpeak(b), mkType(c));
    const rev = l === 1 ? U.words.slice(0,5) : C.allWords.filter(w => seen(w) && w.u < U.index);
    if (rev.length) seq.push(mkType(pick(rev)));
  } else if (l === 2){
    const s = U.sents, f = shuffle(U.fills);
    seq.push(mkPattern(U), mkBuild(C,s[0],'t2e'), mkFill(f[0]), mkBuild(C,s[1],'e2t'), mkFree(s[0]), mkBuild(C,s[2],'t2e'), mkFill(f[1]),
             mkSpeak(s[3]), mkBuild(C,s[3],'e2t'), mkFill(f[2]), mkBuild(C,s[4],'e2t'), V ? mkDict(s[5]) : mkBuild(C,s[5],'e2t'), mkFree(s[5]));
  } else {
    const ws = shuffle(U.words), ss = shuffle(U.sents), ff = shuffle(U.fills);
    seq.push(mkType(ws[0]), mkBuild(C,ss[0],'e2t'), mkType(ws[1]), mkFill(ff[0]), mkRead(U,0), mkRead(U,1), mkType(ws[2]), mkFree(ss[1]),
             V ? mkDict(ss[2]) : mkBuild(C,ss[2],'e2t'), mkType(ws[3]), mkFill(ff[1]), mkSpeak(ss[3]), mkFree(ss[4]), mkType(ws[4]), mkBuild(C,ss[5],'t2e'));
  }
  return seq;
}
function reviewEx(C, it){
  const r = Math.random();
  if (it.kind === 's') return r < .4 ? mkFree(it) : r < .8 ? mkBuild(C, it, 'e2t') : mkBuild(C, it, 't2e');
  if (it.kind === 'f') return mkFill(it);
  return r < .6 ? mkType(it) : (r < .8 && hasVoice(C.code)) ? mkListen(C, it) : mkMC(C, it, 'e2t');
}
function buildReview(code, extra){
  const C = COURSES[code];
  const pool = extra
    ? C.all.filter(seen).sort((a,b) => (rec(a).b - rec(b).b) || (rec(a).due - rec(b).due)).slice(0, 12)
    : dueItems(code).slice(0, REVIEW_CAP);
  if (!pool.length) return null;
  return shuffle(pool).map(it => reviewEx(C, it));
}

      <div class="reveal" id="reveal" lang="${lg}"></div><p class="sub-en">Say it out loud first, then reveal and judge yourself. Be strict.</p>`;
    footHTML = `<button class="btn wide" id="check" data-act="reveal">Reveal</button>`;
  } else if (ex.k === 'fill'){
    h = `<div class="qhead"><h2 class="qt">Fill in the blank</h2></div>
      <div><div class="sent" lang="${lg}">${glossTokens(ex.item.t, L.code)}</div><p class="sub-en">${esc(ex.item.en)}</p></div>
      <div class="hint" id="hint" aria-live="polite"></div>${optList(true)}`;
  } else if (ex.k === 'build'){
    const t2e = ex.dir === 't2e';
    h = `<div class="qhead"><h2 class="qt">${t2e ? 'Translate into English' : `Build this in ${C.name}`}</h2></div>
      <div class="prompt">${t2e ? spkBtn(ex.item.t) : ''}<span class="sent" ${t2e?`lang="${lg}"`:''}>${t2e ? glossTokens(ex.item.t, L.code) : esc(ex.item.en)}</span></div>
      ${t2e ? '<div class="hint" id="hint" aria-live="polite">Tap a dotted word for its meaning.</div>' : ''}
      <div class="lines" id="lines" aria-label="Your answer"></div><div class="bank" id="bank"></div>`;
  } else if (ex.k === 'read'){
    h = `<div class="qhead"><span class="newtag">Reading</span><h2 class="qt">${esc(ex.q[0])}</h2></div>
      <div class="passage" lang="${lg}">${glossTokens(ex.U.r.t, L.code)}</div>
      <div class="hint" id="hint" aria-live="polite">Tap a dotted word for its meaning.</div>${optList(false)}`;
  } else if (ex.k === 'match'){
    const idx = ex.items.map((_,i) => i);
    L.m = {t:null, e:null, done:new Set(), ot:shuffle(idx), oe:shuffle(idx), missed:false};
    h = `<div class="qhead"><h2 class="qt">Match the pairs</h2></div><div class="match" id="match"></div>`;
  }
  exEl.innerHTML = h;
  if (ex.k === 'build') drawBuild();
  if (ex.k === 'match') drawMatch();
  const foot = $('#foot'); foot.className = 'foot';
  foot.innerHTML = `<div class="wrap footin">
    ${(ex.k === 'listen' || ex.k === 'dict') ? `<button class="btn btn-text" data-act="nolisten">Can’t listen now</button>` : ''}
    ${footHTML || (ex.k === 'match' ? '<span class="foot-note">Tap a word, then its meaning</span>' : '<button class="btn wide" id="check" data-act="check" disabled>Check</button>')}</div>`;
  setBar();
  const inp = $('#ans');
  if (inp){ inp.addEventListener('input', () => { $('#check').disabled = !inp.value.trim(); }); if (matchMedia('(pointer:fine)').matches) inp.focus(); }
  if (ex.k === 'pattern') $('#cont').focus({preventScroll:true});
  if (S.audio && ((ex.k === 'mc' && ex.dir === 't2e') || ex.k === 'listen' || ex.k === 'dict' || (ex.k === 'build' && ex.dir === 't2e'))) setTimeout(() => speak(ex.item.t, L.code), 250);
}
function drawBuild(){
  const ex = cur(), lg = COURSES[L.code].lang, t = ex.dir === 'e2t' ? `lang="${lg}"` : '';
  $('#lines').innerHTML = L.picked.map(id => `<button class="tile" data-act="atile" data-id="${id}" ${t}>${esc(ex.tiles[id].text)}</button>`).join('');
  $('#bank').innerHTML = ex.tiles.map(tl => `<button class="tile ${L.picked.includes(tl.id)?'used':''}" data-act="tile" data-id="${tl.id}" ${t} ${L.picked.includes(tl.id)?'tabindex="-1" aria-hidden="true"':''}>${esc(tl.text)}</button>`).join('');
  const c = $('#check'); if (c) c.disabled = !L.picked.length;
}
function drawMatch(){
  const ex = cur(), m = L.m, lg = COURSES[L.code].lang;
  const cell = (side, i) => {
    const w = ex.items[i], cls = m.done.has(i) ? 'done' : m[side] === i ? 'sel' : '';
    return `<button class="mt ${cls}" data-act="mt" data-side="${side}" data-i="${i}" ${side==='t'?`lang="${lg}"`:''} ${m.done.has(i)?'disabled':''}>${esc(side==='t'?w.t:w.en)}</button>`;
  };
  $('#match').innerHTML = `<div class="mcol">${m.ot.map(i => cell('t',i)).join('')}</div><div class="mcol">${m.oe.map(i => cell('e',i)).join('')}</div>`;
}
function matchTap(side, i){
  const ex = cur(), m = L.m;
  if (m.done.has(i) || L.locked) return;
  if (side === 't' && S.audio) speak(ex.items[i].t, L.code);
  m[side] = m[side] === i ? null : i;
  if (m.t !== null && m.e !== null){
    const a = m.t, b = m.e;
    if (a === b){
      m.done.add(a); m.t = m.e = null; drawMatch();
      if (m.done.size === ex.items.length) resolve(!m.missed, '', '', true);
    } else {
      m.missed = true;
      grade(ex.items[a], false);
      L.misses.push({q: ex.items[a].t, a: ex.items[a].en});
      drawMatch();
      document.querySelectorAll(`.mt[data-side="t"][data-i="${a}"],.mt[data-side="e"][data-i="${b}"]`).forEach(el => el.classList.add('miss'));
      m.t = m.e = null;
      setTimeout(() => { if (screen === 'lesson' && cur() === ex) drawMatch(); }, 450);
    }
  } else drawMatch();
}
function judgeType(code, w, raw){
  const v = clean(raw), cands = [w.t, ...(w.alt||[])];
  for (const c of cands){ const cc = clean(c); if (v === cc || v === stripArt(cc)) return {ok:true, note: c !== w.t ? `Also: ${w.t}` : ''}; }
  for (const c of cands){ const cc = clean(c); if (stripArt(v) === stripArt(cc)) return {ok:true, note:`Article: ${w.t}`}; }
  for (const c of cands){ const cc = clean(c); if (stripAcc(v) === stripAcc(cc) || stripAcc(v) === stripAcc(stripArt(cc)) || stripAcc(stripArt(v)) === stripAcc(stripArt(cc))) return {ok:true, note: code === 'la' ? `With macrons: ${w.t}` : `Accents: ${w.t}`}; }
  return {ok:false};
}
function judgeSentence(code, ans, raw){
  if (clean(raw) === clean(ans)) return {ok:true, note:''};
  if (norm(raw) === norm(ans)) return {ok:true, note: code === 'la' ? `With macrons: ${ans}` : `Accents: ${ans}`};
  if (code === 'la'){
    const a = tokens(ans).map(norm).sort().join('|'), b = tokens(raw).map(norm).sort().join('|');
    if (a === b) return {ok:true, note:`Latin word order is flexible. Textbook order: ${ans}`};
  }
  return {ok:false, note:''};
}
function promptOf(ex){
  if (ex.k === 'mc') return ex.dir === 't2e' ? ex.item.t : ex.item.en;
  if (ex.k === 'listen' || ex.k === 'dict') return '(audio)';
  if (ex.k === 'read') return ex.q[0];
  if (ex.k === 'build') return ex.dir === 't2e' ? ex.item.t : ex.item.en;
  return ex.item ? ex.item.en : '';
}
function check(){
  if (L.locked) return;
  const ex = cur(); let ok = false, shown = '', note = '';
  if (ex.k === 'mc' || ex.k === 'listen' || ex.k === 'fill' || ex.k === 'read'){
    if (L.sel == null) return;
    ok = L.sel === ex.ans;
    shown = ex.k === 'fill' ? ex.item.t.replace('___', ex.ans) : ex.ans;
    document.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === ex.ans) b.classList.add('right'); else if (b.dataset.v === L.sel) b.classList.add('wrong'); b.classList.remove('sel'); });
  } else if (ex.k === 'type'){
    const v = $('#ans').value; if (!v.trim()) return;
    const r = judgeType(L.code, ex.item, v); ok = r.ok; note = r.note || ''; shown = ex.item.t;
  } else if (ex.k === 'dict'){
    const v = $('#ans').value; if (!v.trim()) return;
    const r = judgeSentence(L.code, ex.ans, v); ok = r.ok; note = r.note; shown = ex.ans;
  } else if (ex.k === 'free'){
    return checkFree();
  } else if (ex.k === 'build'){
    if (!L.picked.length) return;
    const got = L.picked.map(id => ex.tiles[id].text).join(' ');
    const r = ex.dir === 'e2t' ? judgeSentence(L.code, ex.ans, got) : {ok: norm(got) === norm(ex.ans), note:''};
    ok = r.ok; note = r.note; shown = ex.ans;
  }
  resolve(ok, shown, note);
}
async function checkFree(){
  const ex = cur(), v = $('#ans').value; if (!v.trim()) return;
  const C = COURSES[L.code];
  let r = judgeSentence(L.code, ex.ans, v);
  if (!r.ok && sampleNS){
    L.locked = true; $('#ex').classList.add('locked');
    $('#foot').innerHTML = `<div class="wrap footin"><span class="checking">Checking your translation…</span></div>`;
    const prompt = `Grade a beginner's ${C.name} translation.\nEnglish: "${ex.item.en}"\nReference ${C.name}: "${ex.ans}"\nStudent wrote: "${v}"\nMark it correct if the meaning and grammar are right, even if worded differently from the reference. ${L.code === 'la' ? 'Macrons are optional and word order is free.' : 'Missing accents are acceptable; mention them.'} Reply with only JSON: {"ok": true or false, "note": "one short sentence of feedback, empty string if perfect"}`;
    try {
      const res = await Promise.race([sampleNS.json(prompt, {modelTier:'quick'}), new Promise((_,rej) => setTimeout(() => rej(new Error('timeout')), 15000))]);
      if (res && typeof res.ok === 'boolean') r = {ok: res.ok, note: String(res.note || '').slice(0, 200)};
    } catch(e){}
    if (screen !== 'lesson' || cur() !== ex) return;
    L.locked = false;
  }
  resolve(r.ok, ex.ans, r.note);
}
function revealSpeak(){
  const ex = cur(); if (L.locked) return;
  $('#reveal').textContent = ex.ans; speak(ex.ans, L.code);
  $('#foot').innerHTML = `<div class="wrap footin"><div class="self"><button class="btn btn-bad" data-act="self" data-ok="0">Missed it</button><button class="btn btn-ok" data-act="self" data-ok="1">Got it</button></div></div>`;
}
function resolve(ok, shown, note, fromMatch){
  const ex = cur(); L.locked = true;
  $('#ex').classList.add('locked');
  const first = !ex.wrongs;
  if (ex.k === 'match'){ ex.items.forEach(w => grade(w, true, false)); if (!ex.counted){ ex.counted = true; L.done++; if (ok) L.firstTry++; } }
  else {
    grade(ex.item, ok, isStrong(ex));
    if (L.kind === 'review' && ex.item && first){ const t = today(); const g = S.log[t] || {ok:0,n:0}; g.n++; if (ok) g.ok++; S.log[t] = g; const ks = Object.keys(S.log).sort(); if (ks.length > 40) ks.slice(0, ks.length-40).forEach(k => delete S.log[k]); }
    if (ok){ if (!ex.counted){ ex.counted = true; L.done++; if (first) L.firstTry++; } }
    else {
      ex.wrongs = (ex.wrongs||0) + 1;
      if (ex.wrongs === 1 && ex.item) L.misses.push({q: promptOf(ex), a: shown});
      if (ex.k === 'read'){ if (!ex.counted){ ex.counted = true; L.done++; } }
      else if (ex.wrongs <= 2) L.queue.push(ex.k === 'speak' ? mkType(ex.item) : ex);
    }
  }
  if (ok && S.audio){
    const say = ex.k === 'fill' ? ex.item.t.replace('___', ex.ans) : ((ex.k === 'build' && ex.dir === 'e2t') || (ex.k === 'mc' && ex.dir === 'e2t') || ex.k === 'type' || ex.k === 'free') ? ex.item.t : '';
    if (say) setTimeout(() => speak(say, L.code), 120);
  }
  save();
  setBar();
  const foot = $('#foot'), lg = COURSES[L.code].lang;
  const ansLang = (ex.k === 'build' && ex.dir === 't2e') || (ex.k === 'mc' && ex.dir === 't2e') || ex.k === 'read' ? '' : `lang="${lg}"`;
  foot.className = 'foot ' + (ok ? 'ok' : 'bad');
  foot.innerHTML = `<div class="wrap footin" role="status">
    <div class="fbmsg">${ok
      ? `<strong>Correct</strong>${note ? `<div class="fbnote">${esc(note)}</div>` : ''}`
      : fromMatch ? `<strong>Done</strong><div class="fbnote">Missed pairs are back in 10 minutes.</div>`
      : `<strong>Answer:</strong><div class="fbans" ${ansLang}>${esc(shown)}</div>${ex.k==='build'&&ex.dir==='t2e'?`<div class="fbnote" lang="${lg}">${esc(ex.item.t)}</div>`:''}${note ? `<div class="fbnote">${esc(note)}</div>` : ''}${ex.k !== 'read' ? '<div class="fbnote">Comes back at the end of this session.</div>' : ''}`}</div>
    <button class="btn wide ${ok || fromMatch ?'btn-ok':'btn-bad'}" id="cont" data-act="cont">Continue</button></div>`;
  if (fromMatch && !ok) foot.className = 'foot';
  $('#cont').focus({preventScroll:true});
}
function next(){
  if (!L.locked) return;
  const ex = cur();
  if (ex.k === 'pattern' && !ex.counted){ ex.counted = true; L.done++; }
  L.i++;
  if (L.i >= L.queue.length) return complete();
  window.scrollTo(0,0);
  renderEx();
}
function complete(){
  if (L.kind === 'lesson') S.done[L.code][`${L.lv}-${L.u}-${L.l}`] = 1;
  save(true);
  const C = COURSES[L.code];
  const m = Math.max(1, Math.round((Date.now() - L.start)/60e3));
  const due = dueItems(L.code).length;
  const title = L.kind === 'lesson' ? `Unit ${L.u+1} · ${LESSONS[L.l][0]} done` : L.kind === 'review' ? 'Review done' : 'Drill done';
  const uniqMiss = [...new Map(L.misses.map(x => [x.q + '|' + x.a, x])).values()];
  const nx = nextLesson(L.code, L.kind === 'lesson' ? L.lv : curLevel(L.code));
  screen = 'done';
  app.innerHTML = `<div class="wrap endscr">
    <h1>${title}</h1>
    <p class="lead">${L.firstTry} of ${L.total} right on the first try · ${m} min${due ? ` · ${due} item${due>1?'s':''} now due` : ''}</p>
    ${uniqMiss.length ? `<div><p class="lead" style="margin-bottom:8px">Missed this session (back in 10 minutes):</p>
      <ul class="misses">${uniqMiss.map(x => `<li><span class="q">${esc(x.q)}</span><span class="a" lang="${C.lang}">${esc(x.a)}</span></li>`).join('')}</ul></div>` : ''}
    <div class="row">
      ${due ? '<button class="btn" data-act="review">Review due items</button>' : nx ? `<button class="btn" data-act="lesson" data-lv="${nx[0]}" data-u="${nx[1]}" data-l="${nx[2]}">Next: Unit ${nx[1]+1} · ${LESSONS[nx[2]][0]}</button>` : ''}
      <button class="btn btn-line" data-act="home">Back to course</button>
    </div></div>`;
  window.scrollTo(0,0);
}

/* Events */
const ACT = {
  'course': courseSheet,
  'settings': () => settingsSheet(false),
  'close-sheet': closeSheet,
  'setlang': b => { S.lang = b.dataset.lang; save(); closeSheet(); window.scrollTo(0,0); renderHome(); },
  'level': b => { viewLevel[S.lang] = +b.dataset.lv; renderHome(); },
  'audio': () => { S.audio = !S.audio; save(); settingsSheet(false); },
  'reset': () => settingsSheet(true),
  'reset-yes': () => { S.done[S.lang] = {}; Object.keys(S.items).forEach(k => { if (k.startsWith(S.lang+'|')) delete S.items[k]; }); save(true); closeSheet(); renderHome(); toast(`${COURSES[S.lang].name} progress erased`); },
  'words': b => wordsSheet(+b.dataset.u),
  'pattern': b => patternSheet(+b.dataset.u),
  'lesson': b => startSession('lesson', +b.dataset.lv, +b.dataset.u, +b.dataset.l),
  'review': () => startSession('review'),
  'extra': () => startSession('extra'),
  'home': () => { closeSheet(); renderHome(); window.scrollTo(0,0); },
  'say': b => speak(b.dataset.say, L ? L.code : S.lang),
  'sayslow': b => speak(b.dataset.say, L.code, true),
  'quit': () => openSheet(`<h3>Stop this session?</h3><p>Answers so far are already in your review schedule. The lesson won't be marked done.</p>
     <div class="row"><button class="btn wide" data-act="close-sheet">Keep going</button><button class="btn btn-text" data-act="quit-yes">Stop</button></div>`, 'Stop session'),
  'quit-yes': () => { closeSheet(); save(true); renderHome(); },
  'opt': b => {
    if (L.locked) return;
    L.sel = b.dataset.v;
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o === b));
    $('#check').disabled = false;
    const ex = cur(); if (S.audio && ex.k !== 'read' && (ex.k !== 'mc' || ex.dir === 'e2t')) speak(L.sel, L.code);
  },
  'tile': b => { if (L.locked) return; const id = +b.dataset.id; if (!L.picked.includes(id)){ L.picked.push(id); if (S.audio && cur().dir === 'e2t') speak(cur().tiles[id].text, L.code); drawBuild(); } },
  'atile': b => { if (L.locked) return; const id = +b.dataset.id; L.picked = L.picked.filter(x => x !== id); drawBuild(); },
  'mt': b => matchTap(b.dataset.side, +b.dataset.i),
  'acc': b => { const inp = $('#ans'); if (!inp) return; const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s; inp.value = inp.value.slice(0,s) + b.dataset.c + inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1, s+1); $('#check').disabled = !inp.value.trim(); },
  'gl': b => { const h = $('#hint'); if (h) h.innerHTML = `<b lang="${COURSES[L.code].lang}">${esc(b.dataset.w)}</b> = ${esc(b.dataset.g)}`; speak(b.dataset.w, L.code); },
  'check': check,
  'reveal': revealSpeak,
  'self': b => resolve(b.dataset.ok === '1', cur().ans, ''),
  'cont': next,
  'nolisten': () => { const ex = cur(); const n = ex.k === 'dict' ? mkBuild(COURSES[L.code], ex.item, 'e2t') : mkType(ex.item); n.counted = ex.counted; n.wrongs = ex.wrongs; L.queue[L.i] = n; renderEx(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f){ e.preventDefault(); f(b, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetRoot.innerHTML){ closeSheet(); return; }
  if (e.target.classList && e.target.classList.contains('gl') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); ACT.gl(e.target); return; }
  if (screen !== 'lesson' || sheetRoot.innerHTML) return;
  const inInput = e.target.tagName === 'INPUT';
  if (e.key === 'Enter'){
    const btn = e.target.closest && e.target.closest('button');
    if (btn && !inInput && btn.id !== 'check' && btn.id !== 'cont') return;
    e.preventDefault();
    if (L.locked){ if ($('#cont')) next(); }
    else { const c = $('#check'); if (c && !c.disabled) (cur().k === 'speak' ? revealSpeak() : check()); }
    return;
  }
  if (inInput || L.locked) return;
  const ex = cur();
  if (/^[1-9]$/.test(e.key) && (ex.k === 'mc' || ex.k === 'listen' || ex.k === 'fill' || ex.k === 'read')){
    const o = document.querySelectorAll('.opt')[+e.key - 1]; if (o) ACT.opt(o);
  } else if (e.key === 'Backspace' && ex.k === 'build' && L.picked.length){
    L.picked.pop(); drawBuild();
  }
});

renderHome();
initRemote();
})();
</script>
