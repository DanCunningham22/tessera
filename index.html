<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D55C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tessera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tessera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 600px column. Home = review card first (what's due), then units as plain lesson lists. Lesson = progress bar, exercise, fixed check bar. No game layer. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunk:#E6EAF0; --ink:#18202F; --muted:#5B677C; --line:#D5DBE4;
  --accent:#2D55C8; --accent-d:#1E3C99; --accent-t:#E3E9FA;
  --ok:#1F8A65; --ok-d:#166B4E; --ok-t:#DDF1E8;
  --bad:#BC3C35; --bad-d:#8E2A25; --bad-t:#FAE4E2;
  --on:#FFFFFF;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151E; --surface:#19202E; --sunk:#141A25; --ink:#E6EBF3; --muted:#97A3B7; --line:#2A3345;
  --accent:#6A8DF2; --accent-d:#3E5FC2; --accent-t:#1D2A4B;
  --ok:#3CBE8C; --ok-d:#258560; --ok-t:#13302A;
  --bad:#EC6B62; --bad-d:#A9443D; --bad-t:#3A1E1D;
  --on:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151E; --surface:#19202E; --sunk:#141A25; --ink:#E6EBF3; --muted:#97A3B7; --line:#2A3345;
  --accent:#6A8DF2; --accent-d:#3E5FC2; --accent-t:#1D2A4B;
  --ok:#3CBE8C; --ok-d:#258560; --ok-t:#13302A;
  --bad:#EC6B62; --bad-d:#A9443D; --bad-t:#3A1E1D;
  --on:#FFFFFF; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--on);box-shadow:0 2px 0 var(--accent-d);font-weight:600;font-size:16px}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:none}
.btn[disabled]{background:var(--sunk);box-shadow:none;color:var(--muted);cursor:default}
.btn.wide{flex:1 1 auto}
.btn-ok{background:var(--ok);box-shadow:0 2px 0 var(--ok-d)}
.btn-bad{background:var(--bad);box-shadow:0 2px 0 var(--bad-d)}
.btn-line{background:var(--surface);color:var(--accent);box-shadow:none;border:2px solid var(--line)}
.btn-line[disabled]{background:var(--surface);color:var(--muted)}
.btn-text{background:none;box-shadow:none;color:var(--muted);padding:0 8px;min-height:44px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk)}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:12px;font-weight:600;min-width:0}
.chip:hover{background:var(--sunk)}
.code{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--on);font-weight:700;font-size:13px;letter-spacing:.04em;flex:none}

.home{padding-block:20px 80px;display:flex;flex-direction:column;gap:28px}
.hero h1{font-size:clamp(26px,6vw,32px);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.fig{background:var(--surface);padding:10px 12px}
.fig b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.fig span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.card .row .btn{flex:1 1 180px}

.unit{display:flex;flex-direction:column;gap:10px}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.uhead>div{min-width:0}
.ulabel{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.uhead h2{margin:2px 0 0;font-size:20px;line-height:1.2}
.uhead h2 small{font-weight:400;color:var(--muted);font-size:15px}
.lessons{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.lrow:hover{border-color:var(--muted)}
.lrow .st{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:var(--on)}
.lrow.done .st{background:var(--ok);border-color:var(--ok)}
.lrow.next{border:2px solid var(--accent);padding:11px 13px}
.lrow .lname{font-weight:600}
.lrow .lsub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-t);padding:3px 8px;border-radius:6px}
.endlevel{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px;margin:0}

.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:20}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);max-height:86vh;overflow:auto;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sheet h3{margin:0;font-size:20px}
.sheet h4{margin:20px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p{color:var(--muted);margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.courses{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px}
.crow.on{border:2px solid var(--accent);padding:11px}
.crow b{display:block}
.crow small{color:var(--muted);font-size:13px}
.pct{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.wlist,.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wlist li{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.slist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.wt{font-weight:600}
.we,.se{color:var(--muted);font-size:14px}
.due{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.switch{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;padding:4px 0}
.switch .knob{width:50px;height:30px;border-radius:30px;background:var(--sunk);border:1px solid var(--line);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted)}
.switch[aria-checked="true"] .knob{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"] .knob::after{transform:translateX(20px);background:var(--on)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.savebadge{display:inline-flex;align-items:center;gap:8px;font-size:14px;background:var(--sunk);padding:8px 12px;border-radius:10px}
.savebadge i{width:8px;height:8px;border-radius:2px;background:var(--muted)}
.savebadge.acct i{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center}

.lesson{display:flex;flex-direction:column;min-height:100%}
.ltop{display:flex;align-items:center;gap:12px;padding-block:12px}
.track{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fillbar{height:100%;width:0;border-radius:99px;background:var(--ok);transition:width .3s ease}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
#ex{padding-block:10px 190px;display:flex;flex-direction:column;gap:20px}
#ex.locked .opt,#ex.locked .tile,#ex.locked .input,#ex.locked .acc{pointer-events:none}
.qhead{display:flex;flex-direction:column;gap:4px}
.newtag{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.qt{margin:0;font-size:20px;font-weight:600;line-height:1.25;text-wrap:balance}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-size:28px;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.sent{font-size:21px;font-weight:500;line-height:1.5;min-width:0}
.spk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-t);color:var(--accent);flex:none}
.spk.sm{width:34px;height:34px;border-radius:9px}
.spk.huge{width:88px;height:88px;border-radius:20px}
.spk.slow{width:60px;height:60px;border-radius:16px;font-size:13px;font-weight:600}
.listenrow{display:flex;align-items:flex-end;gap:16px;justify-content:center;padding-block:8px}
.gl{border-bottom:2px dotted var(--muted);cursor:pointer;padding-bottom:1px}
.gl:hover{border-bottom-color:var(--accent);color:var(--accent)}
.hint{min-height:22px;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);text-align:center}
.sub-en{color:var(--muted);font-size:15px;margin:0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;text-align:left}
.opt:hover{background:var(--sunk)}
.opt .k{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;font-size:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-t)}
.opt.right{border-color:var(--ok);background:var(--ok-t)}
.opt.wrong{border-color:var(--bad);background:var(--bad-t)}
.lines{min-height:112px;padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 55px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:9px 14px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px}
.tile.used{background:var(--sunk);border-color:var(--sunk);color:transparent;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{min-height:54px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:var(--accent-t)}
.mt.done{opacity:.35;pointer-events:none}
.mt.miss{border-color:var(--bad);background:var(--bad-t)}
.input{width:100%;font:inherit;font-size:20px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.acc{min-width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot.ok{background:var(--ok-t);border-top-color:var(--ok-t)}
.foot.bad{background:var(--bad-t);border-top-color:var(--bad-t)}
.footin{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:14px}
.footin .btn.wide{min-width:min(100%,200px)}
.foot-note{color:var(--muted);font-size:14px;flex:1;text-align:center}
.fbmsg{flex:1 1 260px;min-width:0}
.fbmsg strong{display:block;font-size:18px}
.foot.ok .fbmsg strong{color:var(--ok)}
.foot.bad .fbmsg strong{color:var(--bad)}
.fbans{font-size:17px;margin-top:2px;overflow-wrap:anywhere;font-weight:500}
.fbnote{font-size:14px;margin-top:4px;color:var(--muted)}

.endscr{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.endscr h1{margin:0;font-size:26px;line-height:1.2}
.endscr .lead{margin:0;color:var(--muted)}
.misses{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.misses li{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.misses li:last-child{border-bottom:0}
.misses .q{color:var(--muted)}
.misses .a{font-weight:600}
.endscr .row .btn{flex:1 1 180px}
</style>

</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" hidden></div>

    nw.forEach((w,i) => { seq.push(mkMC(C, w, 't2e', !seen(w))); if (i % 2 === 1) seq.push(mkMC(C, nw[i-1], 'e2t')); });
    seq.push(mkMatch(nw));
    const r = shuffle(nw);
    seq.push(mkType(r[0]), mkType(r[1]), V ? mkListen(C, r[2]) : mkMC(C, r[2], 'e2t'), mkType(r[3]), mkType(r[4]));
    const rev = l === 1 ? U.words.slice(0,5) : C.allWords.filter(w => w.u < u);
    if (rev.length) seq.push(mkType(pick(rev)));
  } else if (l === 2){
    const s = U.sents, f = shuffle(U.fills);
    seq.push(mkBuild(C,s[0],'t2e'), mkFill(f[0]), mkBuild(C,s[1],'e2t'), mkBuild(C,s[2],'t2e'), mkFill(f[1]),
             mkBuild(C,s[3],'e2t'), mkType(pick(U.words)), mkBuild(C,s[4],'e2t'), mkFill(f[2]),
             V ? mkListen(C, pick(U.words)) : mkType(pick(U.words)));
  } else {
    const ws = shuffle(U.words), ss = shuffle(U.sents), ff = shuffle(U.fills);
    seq.push(mkType(ws[0]), mkBuild(C,ss[0],'e2t'), mkType(ws[1]), mkFill(ff[0]), mkType(ws[2]),
             mkBuild(C,ss[1],'e2t'), V ? mkListen(C,ws[3]) : mkType(ws[3]), mkType(ws[4]), mkFill(ff[1]),
             mkBuild(C,ss[2],'e2t'), mkType(ws[5]), mkBuild(C,ss[3],'t2e'), mkType(ws[6]));
  }
  return seq;
}
function reviewEx(C, it){
  if (it.kind === 's') return mkBuild(C, it, Math.random() < .75 ? 'e2t' : 't2e');
  if (it.kind === 'f') return mkFill(it);
  const r = Math.random();
  return r < .6 ? mkType(it) : (r < .8 && hasVoice(C.code)) ? mkListen(C, it) : mkMC(C, it, 'e2t');
}
function buildReview(code, extra){
  const C = COURSES[code];
  let pool = extra
    ? C.all.filter(seen).sort((a,b) => (rec(a).b - rec(b).b) || (rec(a).due - rec(b).due)).slice(0, 12)
    : dueItems(code).slice(0, REVIEW_CAP);
  if (!pool.length) return null;
  return shuffle(pool).map(it => reviewEx(C, it));
}

function matchTap(side, i){

  for (const c of cands){ const cc = clean(c); if (stripArt(v) === stripArt(cc)) return {ok:true, note:`Article: ${w.t}`}; }
  for (const c of cands){ const cc = clean(c); if (stripAcc(v) === stripAcc(cc) || stripAcc(v) === stripAcc(stripArt(cc)) || stripAcc(stripArt(v)) === stripAcc(stripArt(cc))) return {ok:true, note: code === 'la' ? `With macrons: ${w.t}` : `Accents: ${w.t}`}; }

}
function check(){

  if (ex.k === 'mc' || ex.k === 'listen' || ex.k === 'fill'){

    shown = ex.k === 'fill' ? ex.item.t.replace('___', ex.ans) : ex.ans;
    document.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === ex.ans) b.classList.add('right'); else if (b.dataset.v === L.sel) b.classList.add('wrong'); b.classList.remove('sel'); });
  } else if (ex.k === 'type'){

    else {

  }
  if (ok && S.audio){
    const say = ex.k === 'fill' ? ex.item.t.replace('___', ex.ans) : ((ex.k === 'build' && ex.dir === 'e2t') || (ex.k === 'mc' && ex.dir === 'e2t') || ex.k === 'type') ? ex.item.t : '';

  foot.innerHTML = `<div class="wrap footin" role="status">
    <div class="fbmsg">${ok
      ? `<strong>Correct</strong>${note ? `<div class="fbnote">${esc(note)}</div>` : ''}`
      : fromMatch ? `<strong>Done</strong><div class="fbnote">Missed pairs will come back in review.</div>`
      : `<strong>Answer:</strong><div class="fbans" ${ansLang}>${esc(shown)}</div>${ex.k==='build'&&ex.dir==='t2e'?`<div class="fbnote" lang="${lg}">${esc(ex.item.t)}</div>`:''}<div class="fbnote">It will come back at the end.</div>`}</div>
    <button class="btn wide ${ok || fromMatch ?'btn-ok':'btn-bad'}" id="cont" data-act="cont">Continue</button></div>`;

}

function complete(){

  const C = COURSES[L.code];
  const mins = Math.max(1, Math.round((Date.now() - L.start)/60e3));
  const due = dueItems(L.code).length;
  const title = L.kind === 'lesson' ? `Unit ${L.u+1} · ${LESSONS[L.l][0]} done` : L.kind === 'review' ? 'Review done' : 'Drill done';
  const uniqMiss = [...new Map(L.misses.map(m => [m.q + '|' + m.a, m])).values()];
  const flat = []; C.units.forEach((U,u) => [0,1,2,3].forEach(l => flat.push([u,l])));
  const nx = flat.find(([u,l]) => !S.done[L.code][u+'-'+l]);
  screen = 'done';
  app.innerHTML = `<div class="wrap endscr">
    <h1>${title}</h1>
    <p class="lead">${L.firstTry} of ${L.total} right on the first try · about ${mins} min${due ? ` · ${due} item${due>1?'s':''} now due for review` : ''}</p>
    ${uniqMiss.length ? `<div><p class="lead" style="margin-bottom:8px">Missed this session (scheduled for review in 10 minutes):</p>
      <ul class="misses">${uniqMiss.map(m => `<li><span class="q">${esc(m.q)}</span><span class="a" lang="${C.lang}">${esc(m.a)}</span></li>`).join('')}</ul></div>` : ''}
    <div class="row">
      ${due ? '<button class="btn" data-act="review">Review due items</button>' : nx ? `<button class="btn" data-act="lesson" data-u="${nx[0]}" data-l="${nx[1]}">Next: Unit ${nx[0]+1} · ${LESSONS[nx[1]][0]}</button>` : ''}
      <button class="btn btn-line" data-act="home">Back to course</button>
    </div></div>`;
  window.scrollTo(0,0);
}

/* Events */
const ACT = {
  'course': courseSheet,
  'settings': () => settingsSheet(false),
  'close-sheet': closeSheet,
  'setlang': b => { S.lang = b.dataset.lang; save(); closeSheet(); window.scrollTo(0,0); renderHome(); },
  'audio': () => { S.audio = !S.audio; save(); settingsSheet(false); },
  'reset': () => settingsSheet(true),
  'reset-yes': () => { S.done[S.lang] = {}; Object.keys(S.items).forEach(k => { if (k.startsWith(S.lang+'|')) delete S.items[k]; }); save(true); closeSheet(); renderHome(); toast(`${COURSES[S.lang].name} progress erased`); },
  'words': b => wordsSheet(+b.dataset.u),
  'lesson': b => startSession('lesson', +b.dataset.u, +b.dataset.l),
  'review': () => startSession('review'),
  'extra': () => startSession('extra'),
  'home': () => { closeSheet(); renderHome(); window.scrollTo(0,0); },
  'say': b => speak(b.dataset.say, L ? L.code : S.lang),
  'sayslow': b => speak(b.dataset.say, L.code, true),
  'quit': () => openSheet(`<h3>Stop this session?</h3><p>Answers so far are already saved to your review schedule. The lesson won't be marked done.</p>
     <div class="row"><button class="btn wide" data-act="close-sheet">Keep going</button><button class="btn btn-text" data-act="quit-yes">Stop</button></div>`, 'Stop session'),
  'quit-yes': () => { closeSheet(); save(true); renderHome(); },
  'opt': b => {
    if (L.locked) return;
    L.sel = b.dataset.v;
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o === b));
    $('#check').disabled = false;
    const ex = cur(); if (S.audio && (ex.k !== 'mc' || ex.dir === 'e2t')) speak(L.sel, L.code);
  },
  'tile': b => { if (L.locked) return; const id = +b.dataset.id; if (!L.picked.includes(id)){ L.picked.push(id); if (S.audio && cur().dir === 'e2t') speak(cur().tiles[id].text, L.code); drawBuild(); } },
  'atile': b => { if (L.locked) return; const id = +b.dataset.id; L.picked = L.picked.filter(x => x !== id); drawBuild(); },
  'mt': b => matchTap(b.dataset.side, +b.dataset.i),
  'acc': b => { const inp = $('#ans'); const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s; inp.value = inp.value.slice(0,s) + b.dataset.c + inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1, s+1); $('#check').disabled = !inp.value.trim(); },
  'gl': b => { const h = $('#hint'); if (h) h.innerHTML = `<b lang="${COURSES[L.code].lang}">${esc(b.dataset.w)}</b> = ${esc(b.dataset.g)}`; speak(b.dataset.w, L.code); },
  'check': check,
  'cont': next,
  'nolisten': () => { const ex = cur(); const n = mkType(ex.item); n.counted = ex.counted; L.queue[L.i] = n; renderEx(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f){ e.preventDefault(); f(b, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetRoot.innerHTML){ closeSheet(); return; }
  if (e.target.classList && e.target.classList.contains('gl') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); ACT.gl(e.target); return; }
  if (screen !== 'lesson' || sheetRoot.innerHTML) return;
  const inInput = e.target.tagName === 'INPUT';
  if (e.key === 'Enter'){
    const btn = e.target.closest && e.target.closest('button');
    if (btn && !inInput && btn.id !== 'check' && btn.id !== 'cont') return;
    e.preventDefault();
    if (L.locked){ if ($('#cont')) next(); }
    else { const c = $('#check'); if (c && !c.disabled) check(); }
    return;
  }
  if (inInput || L.locked) return;
  const ex = cur();
  if (/^[1-9]$/.test(e.key) && (ex.k === 'mc' || ex.k === 'listen' || ex.k === 'fill')){
    const o = document.querySelectorAll('.opt')[+e.key - 1]; if (o) ACT.opt(o);
  } else if (e.key === 'Backspace' && ex.k === 'build' && L.picked.length){
    L.picked.pop(); drawBuild();
  }
});

renderHome();
initRemote();
})();
</script>

</body>
