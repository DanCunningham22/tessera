  setBar();
  const inp = $('#ans');
  if (inp){ inp.addEventListener('input', () => { $('#check').disabled = !inp.value.trim(); }); if (matchMedia('(pointer:fine)').matches) inp.focus(); }
  if (ex.k === 'pattern' || ex.k === 'passage') $('#cont').focus({preventScroll:true});
  if (S.audio && ((ex.k === 'mc' && ex.dir === 't2e') || ex.k === 'listen' || ex.k === 'dict' || (ex.k === 'build' && ex.dir === 't2e'))) setTimeout(() => speak(ex.item.t, L.code), 250);
}
function drawBuild(){
  const ex = cur(), lg = COURSES[L.code].lang, t = ex.dir === 'e2t' ? `lang="${lg}"` : '';
  $('#lines').innerHTML = L.picked.map(id => `<button class="tile" data-act="atile" data-id="${id}" ${t}>${esc(ex.tiles[id].text)}</button>`).join('');
  $('#bank').innerHTML = ex.tiles.map(tl => `<button class="tile ${L.picked.includes(tl.id)?'used':''}" data-act="tile" data-id="${tl.id}" ${t} ${L.picked.includes(tl.id)?'tabindex="-1" aria-hidden="true"':''}>${esc(tl.text)}</button>`).join('');
  const c = $('#check'); if (c) c.disabled = !L.picked.length;
}
function drawMatch(){
  const ex = cur(), m = L.m, lg = COURSES[L.code].lang;
  const cell = (side, i) => {
    const w = ex.items[i], cls = m.done.has(i) ? 'done' : m[side] === i ? 'sel' : '';
    return `<button class="mt ${cls}" data-act="mt" data-side="${side}" data-i="${i}" ${side==='t'?`lang="${lg}"`:''} ${m.done.has(i)?'disabled':''}>${esc(side==='t'?w.t:w.en)}</button>`;
  };
  $('#match').innerHTML = `<div class="mcol">${m.ot.map(i => cell('t',i)).join('')}</div><div class="mcol">${m.oe.map(i => cell('e',i)).join('')}</div>`;
}
function matchTap(side, i){
  const ex = cur(), m = L.m;
  if (m.done.has(i) || L.locked) return;
  if (side === 't' && S.audio) speak(ex.items[i].t, L.code);
  m[side] = m[side] === i ? null : i;
  if (m.t !== null && m.e !== null){
    const a = m.t, b = m.e;
    if (a === b){
      m.done.add(a); m.t = m.e = null; drawMatch();
      if (m.done.size === ex.items.length) resolve(!m.missed, '', '', true);
    } else {
      m.missed = true;
      grade(ex.items[a], false);
      L.misses.push({q: ex.items[a].t, a: ex.items[a].en});
      drawMatch();
      document.querySelectorAll(`.mt[data-side="t"][data-i="${a}"],.mt[data-side="e"][data-i="${b}"]`).forEach(el => el.classList.add('miss'));
      m.t = m.e = null;
      setTimeout(() => { if (screen === 'lesson' && cur() === ex) drawMatch(); }, 450);
    }
  } else drawMatch();
}
function judgeType(code, w, raw){
  const v = clean(raw), cands = [w.t, ...(w.alt||[])];
  for (const c of cands){ const cc = clean(c); if (v === cc || v === stripArt(cc)) return {ok:true, note: c !== w.t ? `Also: ${w.t}` : ''}; }
  for (const c of cands){ const cc = clean(c); if (stripArt(v) === stripArt(cc)) return {ok:true, note:`Article: ${w.t}`}; }
  for (const c of cands){ const cc = clean(c); if (stripAcc(v) === stripAcc(cc) || stripAcc(v) === stripAcc(stripArt(cc)) || stripAcc(stripArt(v)) === stripAcc(stripArt(cc))) return {ok:true, note: code === 'la' ? `With macrons: ${w.t}` : `Accents: ${w.t}`}; }
  return {ok:false};
}
function judgeSentence(code, ans, raw){
  if (clean(raw) === clean(ans)) return {ok:true, note:''};
  if (norm(raw) === norm(ans)) return {ok:true, note: code === 'la' ? `With macrons: ${ans}` : `Accents: ${ans}`};
  if (code === 'la'){
    const a = tokens(ans).map(norm).sort().join('|'), b = tokens(raw).map(norm).sort().join('|');
    if (a === b) return {ok:true, note:`Latin word order is flexible. Textbook order: ${ans}`};
  }
  return {ok:false, note:''};
}
function promptOf(ex){
  if (ex.k === 'mc') return ex.dir === 't2e' ? ex.item.t : ex.item.en;
  if (ex.k === 'listen' || ex.k === 'dict') return '(audio)';
  if (ex.k === 'read') return ex.q[0];
  if (ex.k === 'build') return ex.dir === 't2e' ? ex.item.t : ex.item.en;
  return ex.item ? ex.item.en : '';
}
function check(){
  if (L.locked) return;
  const ex = cur(); let ok = false, shown = '', note = '';
  if (ex.k === 'mc' || ex.k === 'listen' || ex.k === 'fill' || ex.k === 'read'){
    if (L.sel == null) return;
    ok = L.sel === ex.ans;
    shown = ex.k === 'fill' ? ex.item.t.replace('___', ex.ans) : ex.ans;
    document.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === ex.ans) b.classList.add('right'); else if (b.dataset.v === L.sel) b.classList.add('wrong'); b.classList.remove('sel'); });
  } else if (ex.k === 'type'){
    const v = $('#ans').value; if (!v.trim()) return;
    const r = judgeType(L.code, ex.item, v); ok = r.ok; note = r.note || ''; shown = ex.item.t;
  } else if (ex.k === 'dict'){
    const v = $('#ans').value; if (!v.trim()) return;
    const r = judgeSentence(L.code, ex.ans, v); ok = r.ok; note = r.note; shown = ex.ans;
  } else if (ex.k === 'free'){
    return checkFree();
  } else if (ex.k === 'build'){
    if (!L.picked.length) return;
    const got = L.picked.map(id => ex.tiles[id].text).join(' ');
    const r = ex.dir === 'e2t' ? judgeSentence(L.code, ex.ans, got) : {ok: norm(got) === norm(ex.ans), note:''};
    ok = r.ok; note = r.note; shown = ex.ans;
  }
  resolve(ok, shown, note);
}
async function checkFree(){
  const ex = cur(), v = $('#ans').value; if (!v.trim()) return;
  const C = COURSES[L.code];
  let r = judgeSentence(L.code, ex.ans, v);
  if (!r.ok && sampleNS){
    L.locked = true; $('#ex').classList.add('locked');
    $('#foot').innerHTML = `<div class="wrap footin"><span class="checking">Checking your translation…</span></div>`;
    const prompt = `Grade a beginner's ${C.name} translation.\nEnglish: "${ex.item.en}"\nReference ${C.name}: "${ex.ans}"\nStudent wrote: "${v}"\nMark it correct if the meaning and grammar are right, even if worded differently from the reference. ${L.code === 'la' ? 'Macrons are optional and word order is free.' : 'Missing accents are acceptable; mention them.'} Reply with only JSON: {"ok": true or false, "note": "one short sentence of feedback, empty string if perfect"}`;
    try {
      const res = await Promise.race([sampleNS.json(prompt, {modelTier:'quick'}), new Promise((_,rej) => setTimeout(() => rej(new Error('timeout')), 15000))]);
      if (res && typeof res.ok === 'boolean') r = {ok: res.ok, note: String(res.note || '').slice(0, 200)};
    } catch(e){}
    if (screen !== 'lesson' || cur() !== ex) return;
    L.locked = false;
  }
  resolve(r.ok, ex.ans, r.note);
}
function revealSpeak(){
  const ex = cur(); if (L.locked) return;
  $('#reveal').textContent = ex.ans; speak(ex.ans, L.code);
  $('#foot').innerHTML = `<div class="wrap footin"><div class="self"><button class="btn btn-bad" data-act="self" data-ok="0">Missed it</button><button class="btn btn-ok" data-act="self" data-ok="1">Got it</button></div></div>`;
}
// Study time is logged answer by answer, so a tab closed mid-session still counts; gaps over 90 s (idle, phone locked) are not.
function tick(){ const now = Date.now(); logTime(L.code, Math.min(90, Math.round((now - L.lastTick)/1000))); L.lastTick = now; }
function resolve(ok, shown, note, fromMatch){
  const ex = cur(); L.locked = true; tick();
  $('#ex').classList.add('locked');
  const first = !ex.wrongs;
  if (ex.k === 'match'){ ex.items.forEach(w => grade(w, true, false)); if (!ex.counted){ ex.counted = true; L.done++; if (ok) L.firstTry++; } }
  else {
    grade(ex.item, ok, isStrong(ex));
    if (L.kind === 'review' && ex.item && first){ const t = today(); const g = S.log[t] || {ok:0,n:0}; g.n++; if (ok) g.ok++; S.log[t] = g; const ks = Object.keys(S.log).sort(); if (ks.length > 40) ks.slice(0, ks.length-40).forEach(k => delete S.log[k]); }
    if (ok){ if (!ex.counted){ ex.counted = true; L.done++; if (first) L.firstTry++; } }
    else {
      ex.wrongs = (ex.wrongs||0) + 1;
      if (ex.wrongs === 1 && ex.item) L.misses.push({q: promptOf(ex), a: shown});
      if (ex.k === 'read'){ if (!ex.counted){ ex.counted = true; L.done++; } }
      else if (ex.wrongs <= 2) L.queue.push(ex.k === 'speak' ? mkType(ex.item) : ex);
    }
  }
  if (ok && S.audio){
    const say = ex.k === 'fill' ? ex.item.t.replace('___', ex.ans) : ((ex.k === 'build' && ex.dir === 'e2t') || (ex.k === 'mc' && ex.dir === 'e2t') || ex.k === 'type' || ex.k === 'free') ? ex.item.t : '';
    if (say) setTimeout(() => speak(say, L.code), 120);
  }
  save();
  setBar();
  const foot = $('#foot'), lg = COURSES[L.code].lang;
  const ansLang = (ex.k === 'build' && ex.dir === 't2e') || (ex.k === 'mc' && ex.dir === 't2e') || ex.k === 'read' ? '' : `lang="${lg}"`;
  foot.className = 'foot ' + (ok ? 'ok' : 'bad');
  foot.innerHTML = `<div class="wrap footin" role="status">
    <div class="fbmsg">${ok
      ? `<strong>Correct</strong>${note ? `<div class="fbnote">${esc(note)}</div>` : ''}`
      : fromMatch ? `<strong>Done</strong><div class="fbnote">Missed pairs are back in 10 minutes.</div>`
      : `<strong>Answer:</strong><div class="fbans" ${ansLang}>${esc(shown)}</div>${ex.k==='build'&&ex.dir==='t2e'?`<div class="fbnote" lang="${lg}">${esc(ex.item.t)}</div>`:''}${note ? `<div class="fbnote">${esc(note)}</div>` : ''}${ex.k !== 'read' ? '<div class="fbnote">Comes back at the end of this session.</div>' : ''}`}</div>
    <button class="btn wide ${ok || fromMatch ?'btn-ok':'btn-bad'}" id="cont" data-act="cont">Continue</button></div>`;
  if (fromMatch && !ok) foot.className = 'foot';
  $('#cont').focus({preventScroll:true});
}
function next(){
  if (!L.locked) return;
  const ex = cur();
  if ((ex.k === 'pattern' || ex.k === 'passage') && !ex.counted){ ex.counted = true; L.done++; }
  L.i++;
  if (L.i >= L.queue.length) return complete();
  window.scrollTo(0,0);
  renderEx();
}
function complete(){
  if (L.kind === 'lesson') S.done[L.code][`${L.lv}-${L.u}-${L.l}`] = 1;
  let passed = null, need = 0;
  if (L.kind === 'testout'){
    need = Math.ceil(L.total * TESTOUT_PASS); passed = L.firstTry >= need;
    if (passed){
      const U = COURSES[L.code].levels[L.lv].units[L.u], t = today(), now = Date.now();
      for (let l = 0; l < 4; l++) S.done[L.code][`${L.lv}-${L.u}-${l}`] = 1;
      for (const it of [...U.words, ...U.sents, ...U.fills]){
        const r = S.items[it.key];
        if (r && r.d === t && r.b === 0) continue; // missed today: stays on the short schedule
        const b = Math.max(r ? r.b : 0, r && r.d === t ? 3 : 2);
        S.items[it.key] = {b, due: now + INTERVALS[b]*DAY, d: t};
      }
    }
  }
  tick();
  save(true);
  const C = COURSES[L.code];
  const m = Math.max(1, Math.round((Date.now() - L.start)/60e3));
  const due = dueItems(L.code).length;
  const title = L.kind === 'lesson' ? `Unit ${L.u+1} · ${LESSONS[L.l][0]} done` : L.kind === 'testout' ? (passed ? `Tested out of Unit ${L.u+1}` : `Unit ${L.u+1}: not yet`) : L.kind === 'review' ? 'Review done' : L.kind === 'reader' ? 'Reading done' : 'Drill done';
  const uniqMiss = [...new Map(L.misses.map(x => [x.q + '|' + x.a, x])).values()];
  const nx = nextLesson(L.code, L.kind === 'lesson' ? L.lv : curLevel(L.code));
  screen = 'done';
  app.innerHTML = `<div class="wrap endscr">
    <h1>${title}</h1>
    <p class="lead">${L.firstTry} of ${L.total} right on the first try${passed !== null ? ` (needed ${need})` : ''} · ${m} min${due ? ` · ${due} item${due>1?'s':''} now due` : ''}</p>
    ${passed === true ? '<p class="lead">All four lessons marked done. The unit’s items start at a 7-day interval; anything you missed comes back in 10 minutes.</p>' : passed === false ? '<p class="lead">Lessons stay open. Your misses are already scheduled; redo the test after reviewing them, or take the lessons.</p>' : ''}
    ${uniqMiss.length ? `<div><p class="lead" style="margin-bottom:8px">Missed this session (back in 10 minutes):</p>
      <ul class="misses">${uniqMiss.map(x => `<li><span class="q">${esc(x.q)}</span><span class="a" lang="${C.lang}">${esc(x.a)}</span></li>`).join('')}</ul></div>` : ''}
    <div class="row">
      ${due ? '<button class="btn" data-act="review">Review due items</button>' : nx ? `<button class="btn" data-act="lesson" data-lv="${nx[0]}" data-u="${nx[1]}" data-l="${nx[2]}">Next: Unit ${nx[1]+1} · ${LESSONS[nx[2]][0]}</button>` : ''}
      <button class="btn btn-line" data-act="home">Back to course</button>
    </div></div>`;
  window.scrollTo(0,0);
}

/* Events */
const ACT = {
  'course': courseSheet,
  'settings': () => settingsSheet(false),
  'close-sheet': closeSheet,
  'setlang': b => { S.lang = b.dataset.lang; save(); closeSheet(); window.scrollTo(0,0); renderHome(); },
  'level': b => { viewLevel[S.lang] = +b.dataset.lv; renderHome(); },
  'audio': () => { S.audio = !S.audio; save(); settingsSheet(false); },
  'reset': () => settingsSheet(true),
  'reset-yes': () => { S.done[S.lang] = {}; Object.keys(S.items).forEach(k => { if (k.startsWith(S.lang+'|')) delete S.items[k]; }); save(true); closeSheet(); renderHome(); toast(`${COURSES[S.lang].name} progress erased`); },
  'words': b => wordsSheet(+b.dataset.u),
  'pattern': b => patternSheet(+b.dataset.u),
  'lesson': b => startSession('lesson', +b.dataset.lv, +b.dataset.u, +b.dataset.l),
  'testout': b => startSession('testout', +b.dataset.lv, +b.dataset.u, 3),
  'review': () => startSession('review'),
  'extra': () => startSession('extra'),
  'home': () => { closeSheet(); renderHome(); window.scrollTo(0,0); },
  'say': b => speak(b.dataset.say, L ? L.code : S.lang),
  'sayslow': b => speak(b.dataset.say, L.code, true),
  'quit': () => openSheet(`<h3>Stop this session?</h3><p>Answers so far are already in your review schedule. The lesson won't be marked done.</p>
     <div class="row"><button class="btn wide" data-act="close-sheet">Keep going</button><button class="btn btn-text" data-act="quit-yes">Stop</button></div>`, 'Stop session'),
  'quit-yes': () => { closeSheet(); if (L) tick(); save(true); renderHome(); },
  'logtime': timeSheet,
  'addtime': b => { logTime(S.lang, +b.dataset.m * 60); save(true); closeSheet(); renderHome(); toast(`${b.dataset.m} min added`); },
  'opt': b => {
    if (L.locked) return;
    L.sel = b.dataset.v;
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o === b));
    $('#check').disabled = false;
    const ex = cur(); if (S.audio && ex.k !== 'read' && (ex.k !== 'mc' || ex.dir === 'e2t')) speak(L.sel, L.code);
  },
  'tile': b => { if (L.locked) return; const id = +b.dataset.id; if (!L.picked.includes(id)){ L.picked.push(id); if (S.audio && cur().dir === 'e2t') speak(cur().tiles[id].text, L.code); drawBuild(); } },
  'atile': b => { if (L.locked) return; const id = +b.dataset.id; L.picked = L.picked.filter(x => x !== id); drawBuild(); },
  'mt': b => matchTap(b.dataset.side, +b.dataset.i),
  'acc': b => {
    const ae = document.activeElement, inp = (ae && ae.tagName === 'INPUT' && ae.id !== 'nw-en') ? ae : ($('#ans') || $('#cin') || $('#nw-t')); if (!inp) return;
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0,s) + b.dataset.c + inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1, s+1);
    const c = $('#check'); if (c && inp.id === 'ans') c.disabled = !inp.value.trim();
  },
  'readsheet': readSheet,
  'readgo': b => { const t = b.dataset.topic || ($('#topicin') ? $('#topicin').value.trim() : ''); if (!t) return toast('Type a topic first.'); generatePassage(t === 'Surprise me' ? 'anything you like, something a curious adult would enjoy' : t); },
  'readcancel': () => { if (readCtl) readCtl.abort(); renderHome(); },
  'reread': b => { const P = S.readings[S.lang][+b.dataset.i]; if (P) startSession('reader', P); },
  'chatsheet': chatSheet,
  'chatgo': b => startChat(+b.dataset.i),
  'csend': chatSend,
  'endchat': endChat,
  'mywords': myWordsSheet,
  'addword': addWordSheet,
  'saveword': () => { const t = $('#nw-t').value, en = $('#nw-en').value; if (!t.trim() || !en.trim()) return toast('Both fields are needed.'); if (addExtra(S.lang, t, en, 'w', 'manual')){ save(true); closeSheet(); renderHome(); toast(`Added: ${t.trim()}`); } else toast('That word is already in the course or your list.'); },
  'delword': b => { S.extra[S.lang].splice(+b.dataset.i, 1); save(true); myWordsSheet(); },
  'gl': b => { const h = $('#hint'); if (h) h.innerHTML = `<b lang="${COURSES[L.code].lang}">${esc(b.dataset.w)}</b> = ${esc(b.dataset.g)}`; speak(b.dataset.w, L.code); },
  'check': check,
  'reveal': revealSpeak,
  'self': b => resolve(b.dataset.ok === '1', cur().ans, ''),
  'cont': next,
  'nolisten': () => { const ex = cur(); const n = ex.k === 'dict' ? mkBuild(COURSES[L.code], ex.item, 'e2t') : mkType(ex.item); n.counted = ex.counted; n.wrongs = ex.wrongs; L.queue[L.i] = n; renderEx(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f){ e.preventDefault(); f(b, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetRoot.innerHTML){ closeSheet(); return; }
  if (e.target.classList && e.target.classList.contains('gl') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); ACT.gl(e.target); return; }
  if (screen === 'chat' && e.key === 'Enter' && e.target.id === 'cin'){ e.preventDefault(); chatSend(); return; }
  if (sheetRoot.innerHTML && e.key === 'Enter' && e.target.id === 'topicin'){ e.preventDefault(); const t = e.target.value.trim(); if (t) generatePassage(t); return; }
  if (sheetRoot.innerHTML && e.key === 'Enter' && (e.target.id === 'nw-t' || e.target.id === 'nw-en')){ e.preventDefault(); ACT.saveword(); return; }
  if (screen !== 'lesson' || sheetRoot.innerHTML) return;
  const inInput = e.target.tagName === 'INPUT';
  if (e.key === 'Enter'){
    const btn = e.target.closest && e.target.closest('button');
    if (btn && !inInput && btn.id !== 'check' && btn.id !== 'cont') return;
    e.preventDefault();
    if (L.locked){ if ($('#cont')) next(); }
    else { const c = $('#check'); if (c && !c.disabled) (cur().k === 'speak' ? revealSpeak() : check()); }
    return;
  }
  if (inInput || L.locked) return;
  const ex = cur();
  if (/^[1-9]$/.test(e.key) && (ex.k === 'mc' || ex.k === 'listen' || ex.k === 'fill' || ex.k === 'read')){
    const o = document.querySelectorAll('.opt')[+e.key - 1]; if (o) ACT.opt(o);
  } else if (e.key === 'Backspace' && ex.k === 'build' && L.picked.length){
    L.picked.pop(); drawBuild();
  }
});

renderHome();
initRemote();
})();
</script>
